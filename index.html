<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>红楼梦诸本对校 · IIIF 善本影像检索</title>
<script src="./vendor/openseadragon.min.js"></script>
<style>
  :root {
    --washi: #f7f4ee;
    --washi-pure: #fcfbf8;
    --sumi: #1c1917;
    --sumi-soft: #4a433c;
    --stone: #8a8075;
    --hairline: rgba(42, 35, 29, 0.11);
    --cinnabar: #a83228;
    --kin: #b07418;
    --kin-wash: rgba(196, 138, 36, 0.16);
    --stage-bg: #11100f;
    --stage-card: #181614;
    --stage-border: rgba(255, 248, 235, 0.10);
    --serif: "Hiragino Mincho ProN", "YuMincho", "Songti SC", "STSong", "Noto Serif CJK JP", "Noto Serif CJK SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "Noto Sans JP", "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }
  ::selection { background: rgba(168, 50, 40, 0.18); color: var(--sumi); }

  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--washi); color: var(--sumi); font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  header {
    height: 50px; background: #161412; color: #efeae1; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    border-bottom: 1px solid rgba(198, 173, 138, 0.22); gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .seal-mark {
    width: 24px; height: 24px; border: 1.5px solid #c94a3f; color: #e05a4e;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border-radius: 2px; background: rgba(168, 50, 40, 0.12); flex-shrink: 0;
  }
  .brand-title { font-size: 15.5px; font-weight: 600; letter-spacing: 0.1em; color: #f5f1e8; white-space: nowrap; }
  .pilot-tag {
    font-family: var(--sans); font-size: 10.5px; color: #d8c39e;
    border: 1px solid rgba(216, 195, 158, 0.35); padding: 1px 7px; border-radius: 2px;
    background: rgba(216, 195, 158, 0.08); white-space: nowrap;
  }

  .nav-bar { display: flex; align-items: center; gap: 7px; font-family: var(--sans); font-size: 11.5px; flex-wrap: nowrap; }
  .seg-group {
    display: inline-flex; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 4px; padding: 2px; gap: 2px;
  }
  .seg-btn {
    border: none; background: transparent; color: #a89f93; padding: 4px 10px;
    border-radius: 3px; font-size: 11.5px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .seg-btn:hover { color: #f2ece1; }
  .seg-btn.active { background: rgba(245, 238, 226, 0.15); color: #fff; font-weight: 500; }

  .ghost-action {
    border: 1px solid rgba(255,255,255,0.13); background: transparent; color: #cfc6b9;
    padding: 4px 9px; border-radius: 4px; font-size: 11.5px; cursor: pointer;
    text-decoration: none; transition: all 0.15s; white-space: nowrap;
  }
  .ghost-action:hover { border-color: rgba(224, 90, 78, 0.65); color: #fff; background: rgba(168, 50, 40, 0.18); }
  .ghost-action.off { opacity: 0.5; }

  .workspace { flex: 1; display: flex; min-height: 0; }

  .drawer {
    width: 472px; min-width: 350px; max-width: 560px; background: var(--washi);
    border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0;
    transition: width 0.2s ease;
  }
  .drawer.collapsed { width: 0; min-width: 0; overflow: hidden; border-right: none; }

  .pane { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .pane.active { display: flex; }

  .scope-notice {
    padding: 8px 18px; background: #efe9dd; border-bottom: 1px solid var(--hairline);
    font-family: var(--sans); font-size: 11.5px; color: #5c5248; line-height: 1.5;
  }

  .composer {
    padding: 14px 18px 13px; background: var(--washi-pure);
    border-bottom: 1px solid var(--hairline);
  }
  .composer-top {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; flex-wrap: wrap;
  }
  .composer-title { font-size: 11.5px; font-family: var(--sans); color: var(--stone); letter-spacing: 0.04em; }
  .preset-bar { display: flex; gap: 7px; flex-wrap: wrap; }
  .preset-chip {
    border: none; background: transparent; color: var(--sumi-soft); font-family: var(--serif);
    font-size: 12px; padding: 1px 0; border-bottom: 1px dotted rgba(74,67,60,0.38); cursor: pointer;
  }
  .preset-chip:hover { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }

  textarea#queriesInput {
    width: 100%; height: 82px; resize: vertical; padding: 9px 11px;
    border: 1px solid rgba(42, 35, 29, 0.16); border-radius: 3px;
    background: var(--washi); color: var(--sumi);
    font-family: var(--serif); font-size: 14.5px; line-height: 1.62;
    outline: none; transition: border-color 0.18s, background 0.18s;
  }
  textarea#queriesInput:focus { border-color: var(--cinnabar); background: #fff; }

  .witness-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .wit-pill {
    font-family: var(--serif); font-size: 12.5px; padding: 3px 9px; border-radius: 2px;
    border: 1px solid rgba(42, 35, 29, 0.15); background: transparent; color: var(--stone);
    cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .wit-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(42,35,29,0.2); }
  .wit-pill.checked { background: #25211e; border-color: #25211e; color: #f7f3eb; }
  .wit-pill.checked .dot { background: #d95348; }

  .composer-foot { display: flex; align-items: center; margin-top: 10px; gap: 6px; }
  .search-submit {
    flex: 1; background: var(--cinnabar); color: #fcf9f2; border: none; padding: 8px 14px;
    border-radius: 3px; font-family: var(--serif); font-size: 13.5px; font-weight: 600;
    letter-spacing: 0.1em; cursor: pointer;
  }
  .search-submit:hover { background: #8e261d; }
  .sub-btn {
    background: transparent; color: var(--sumi-soft); border: 1px solid rgba(42, 35, 29, 0.18);
    padding: 7px 10px; border-radius: 3px; font-family: var(--sans); font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .sub-btn:hover { border-color: var(--sumi); color: var(--sumi); background: rgba(42,35,29,0.04); }

  .apparatus-scroll { flex: 1; overflow-y: auto; padding: 14px 18px 32px; }
  .meta-strip {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--sans); font-size: 11.5px; color: var(--stone);
    padding-bottom: 9px; margin-bottom: 12px; border-bottom: 1px solid var(--hairline);
  }

  .app-entry {
    background: var(--washi-pure); border: 1px solid var(--hairline); border-radius: 3px; margin-bottom: 15px;
  }
  .app-entry.active-entry {
    border-color: rgba(168, 50, 40, 0.4); box-shadow: 0 4px 16px rgba(28, 25, 23, 0.05);
  }
  .app-head {
    padding: 9px 13px; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: rgba(237, 231, 220, 0.38);
  }
  .app-lemma { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .app-idx { font-family: "Georgia", serif; font-size: 11.5px; color: var(--cinnabar); font-style: italic; }
  .app-qtext { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-parallel {
    flex-shrink: 0; border: 1px solid rgba(168, 50, 40, 0.42); background: transparent;
    color: var(--cinnabar); font-family: var(--sans); font-size: 11px; padding: 3px 9px; border-radius: 2px; cursor: pointer;
  }
  .btn-parallel:hover, .app-entry.active-entry .btn-parallel {
    background: var(--cinnabar); color: #fff; border-color: var(--cinnabar);
  }

  .rdg-table { width: 100%; border-collapse: collapse; }
  .rdg-row { border-bottom: 1px solid rgba(42, 35, 29, 0.06); cursor: pointer; }
  .rdg-row:last-child { border-bottom: none; }
  .rdg-row:hover { background: rgba(196, 138, 36, 0.06); }
  .rdg-row.focused { background: rgba(168, 50, 40, 0.055); }
  .rdg-wit { width: 84px; vertical-align: top; padding: 10px 8px 10px 13px; white-space: nowrap; }
  .wit-stamp {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--cinnabar);
    border: 1px solid rgba(168, 50, 40, 0.38); padding: 0 5px; border-radius: 2px; background: rgba(168, 50, 40, 0.04);
  }
  .wit-folio { display: block; font-family: var(--sans); font-size: 10.5px; color: var(--stone); margin-top: 4px; }
  .rdg-text { padding: 9px 13px 10px 4px; font-size: 14.8px; line-height: 1.7; letter-spacing: 0.03em; }
  .rdg-text .ctx { color: #a3998d; font-size: 13.5px; }
  .rdg-text .ch-diff {
    color: #8f4f06; background: var(--kin-wash);
    border-bottom: 1.5px solid rgba(176, 116, 24, 0.65); padding: 0 1px;
  }
  .rdg-banxin {
    display: inline-block; margin-left: 6px; font-family: var(--sans); font-size: 10.5px;
    color: var(--stone); border-left: 1px solid var(--hairline); padding-left: 6px;
  }

  .catalog-list { flex: 1; overflow-y: auto; padding: 15px 18px 30px; }
  .cat-item {
    background: var(--washi-pure); border: 1px solid var(--hairline); border-radius: 3px;
    padding: 13px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .cat-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .cat-id { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--stone); font-weight: 400; }
  .cat-desc { margin: 0; font-size: 12.5px; color: var(--sumi-soft); }
  .cat-meta { margin-top: 6px; font-family: var(--sans); font-size: 11px; color: var(--stone); display: flex; gap: 10px; flex-wrap: wrap; }
  .cat-meta a { color: var(--cinnabar); text-decoration: none; }
  .cat-meta a:hover { text-decoration: underline; }

  .gallery-stage { flex: 1; display: flex; flex-direction: column; background: var(--stage-bg); min-width: 0; }
  .stage-bar {
    height: 35px; background: #161412; color: #9c9286; padding: 0 14px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--sans); font-size: 11.5px; border-bottom: 1px solid var(--stage-border);
  }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 4px; vertical-align: middle; }
  .legend-same { border: 1.5px solid #d1483e; background: rgba(209,72,62,0.18); }
  .legend-diff { border: 1.5px solid #e09f3e; background: rgba(224,159,62,0.25); }

  .windows-grid { flex: 1; display: grid; gap: 1px; background: #26221e; min-height: 0; }
  .windows-grid.cols-1 { grid-template-columns: 1fr; }
  .windows-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .windows-grid.cols-auto {
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    grid-auto-rows: minmax(250px, 1fr);
  }

  .iiif-win { position: relative; background: var(--stage-card); overflow: hidden; display: flex; flex-direction: column; }
  .win-hud {
    position: absolute; top: 9px; left: 9px; right: 9px; z-index: 10;
    height: 33px; padding: 0 10px; border-radius: 4px;
    background: rgba(20, 18, 16, 0.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 248, 235, 0.11);
    display: flex; align-items: center; justify-content: space-between;
    color: #ede6da; font-family: var(--sans); font-size: 11.5px;
  }
  .win-label { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .win-ed { font-family: var(--serif); font-size: 13.5px; font-weight: 700; color: #f7f2e8; }
  .win-banxin { color: #cbb693; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

  .win-nav { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .hud-btn {
    border: none; background: transparent; color: #c7beb2; padding: 3px 6px;
    border-radius: 3px; font-size: 11px; cursor: pointer; text-decoration: none;
  }
  .hud-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .hud-pno {
    width: 40px; background: rgba(0,0,0,0.38); color: #f5efe6; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 2px; padding: 1px 3px; text-align: center; font-size: 11px; font-family: monospace;
  }
  .hud-total { color: #857c70; font-size: 10.5px; margin-right: 2px; font-family: monospace; }
  .osd-mount { flex: 1; width: 100%; height: 100%; }

  .iiif-box-exact {
    border: 1.4px solid rgba(209, 67, 56, 0.86); background: rgba(209, 67, 56, 0.07); border-radius: 1px;
  }
  .iiif-box-var {
    border: 1.7px solid rgba(226, 158, 46, 0.95); background: rgba(226, 158, 46, 0.17);
    border-radius: 1px; box-shadow: 0 0 6px rgba(226, 158, 46, 0.22);
  }
  .hide-boxes .iiif-box-exact, .hide-boxes .iiif-box-var { opacity: 0 !important; pointer-events: none; }
  .stage-placeholder { margin: auto; text-align: center; color: #786f64; font-size: 14px; letter-spacing: 0.06em; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="seal-mark">紅樓</span>
    <span class="brand-title" id="uiTitle">红楼梦诸本对校 · IIIF 善本影像检索</span>
    <span class="pilot-tag" id="uiPilotBadge">先行公开示范版</span>
  </div>

  <div class="nav-bar">
    <div class="seg-group">
      <button class="seg-btn active" id="tabSearchBtn" onclick="switchDrawer('search', this)">诸本对校检索</button>
      <button class="seg-btn" id="tabShelfBtn" onclick="switchDrawer('shelf', this)">IIIF 善本书架</button>
    </div>

    <div class="seg-group">
      <button class="seg-btn active" id="colAutoBtn" onclick="setCols('auto', this)">诸本并观</button>
      <button class="seg-btn" id="col2Btn" onclick="setCols('2', this)">双窗对读</button>
      <button class="seg-btn" id="col1Btn" onclick="setCols('1', this)">单页细读</button>
    </div>

    <button class="ghost-action" id="boxBtn" onclick="toggleBoxes()">显示字框 [B]</button>
    <a class="ghost-action" id="miradorTopLink" href="#" target="_blank">Mirador 3 ↗</a>
    <a class="ghost-action" id="iiifColLink" href="#" target="_blank">IIIF v3</a>

    <div class="seg-group">
      <button class="seg-btn" id="langZh" onclick="setLang('zh')" lang="zh-CN">简体中文</button>
      <button class="seg-btn" id="langJa" onclick="setLang('ja')" lang="ja">日本語</button>
    </div>
  </div>
</header>

<div class="workspace">
  <aside class="drawer" id="leftDrawer">
    <div class="pane active" id="pane-search">
      <div class="scope-notice" id="scopeNotice"></div>
      <div class="composer">
        <div class="composer-top">
          <span class="composer-title" id="composerLabel"></span>
          <div class="preset-bar" id="presetBar"></div>
        </div>
        <textarea id="queriesInput" spellcheck="false">细看形容与众各别，两弯似蹙非蹙罥烟眉，一双似喜非喜含情目，态生两靥之愁，娇袭一身之病
自荣公死后，长子贾代善袭了官，娶的也是金陵世勋史侯家的小姐为妻，生了两个儿子
假作真时真亦假，无为有处有还无
话说贾元春自那日幸大观园回宫去后，便命将那所有的题咏命探春依次抄录妥协</textarea>
        <div class="witness-bar" id="witnessBar"></div>
        <div class="composer-foot">
          <button class="search-submit" id="searchBtn" onclick="executeBatchSearch()"></button>
          <button class="sub-btn" id="annoExportBtn" onclick="exportWebAnnotation()" title="W3C Web Annotation JSON-LD">JSON-LD</button>
          <button class="sub-btn" id="csvExportBtn" onclick="exportCSV()">CSV</button>
        </div>
      </div>
      <div class="apparatus-scroll" id="apparatusList"></div>
    </div>

    <div class="pane" id="pane-shelf">
      <div class="catalog-list" id="catalogList"></div>
    </div>
  </aside>

  <main class="gallery-stage" id="galleryStage">
    <div class="stage-bar">
      <div id="stageCaption"></div>
      <div>
        <span><i class="legend-dot legend-same"></i><span id="legSame"></span></span>
        <span style="margin-left:14px"><i class="legend-dot legend-diff"></i><span id="legDiff"></span></span>
      </div>
    </div>
    <div class="windows-grid cols-auto" id="windowsGrid">
      <div class="stage-placeholder" id="loadingStage">正在加载影像…</div>
    </div>
  </main>
</div>

<script>
const I18N = {
  zh: {
    title: "红楼梦诸本对校 · IIIF 善本影像检索",
    pilot: "先行公开示范版",
    tabSearch: "诸本对校检索",
    tabShelf: "IIIF 善本书架（5种）",
    colAuto: "诸本并观", col2: "双窗对读", col1: "单页细读",
    boxBtn: "显示字框 [B]",
    scope: "公开检索范围为第 1 至 3 回、第 23 至 24 回。五种底本的全卷影像共 3,744 页。",
    composerLabel: "批量检索词句（每行一条，支持简繁汉字、日文新字体和清抄本俗字）",
    presets: ["宝黛初见", "冷子兴演说", "太虚幻境联", "元春题咏", "批量词汇"],
    searchBtn: "检索各本原页",
    statFmt: (q, h, ms) => `检索 ${q} 条 · 命中 ${h} 处 · 用时 ${ms} ms`,
    parallelBtn: (n) => `诸本并观 (${n})`,
    noHit: "公开选页中未检索到此句",
    folioFmt: (p) => `第 ${p} 页`,
    openBook: "展卷",
    legSame: "红框：同字定位",
    legDiff: "金框：异文或清抄本俗字",
    loading: "正在加载影像…", focus: "定位到命中位置", mirador: "在 Mirador 中打开",
    stageIdle: "原页浏览",
    stageParallel: (q, n) => `对校句「${q}」 · 已打开 ${n} 种底本原页`
  },
  ja: {
    title: "紅樓夢諸本對校 · IIIF 善本画像検索システム",
    pilot: "先行公開パイロット版",
    tabSearch: "諸本横断検索",
    tabShelf: "IIIF 善本書架 (5種)",
    colAuto: "諸本並観", col2: "二窓対照", col1: "単葉精覧",
    boxBtn: "字枠表示 [B]",
    scope: "【先行公開範囲】文字列・字枠横断検索は「第一回〜第三回・第二十三回〜第二十四回」を収録。五種古鈔本（全3,744葉・パブリックドメイン）の IIIF v3 画像マニフェストは全巻公開済。",
    composerLabel: "一括検索クエリ（1行1件 ・ 繁体字／簡体字／日本新字体／異体字対応）",
    presets: ["宝黛初見（異文比較）", "冷子興演説", "太虚幻境対聯", "大観園題詠", "語彙一括検索"],
    searchBtn: "諸本原葉を一括検索",
    statFmt: (q, h, ms) => `検索クエリ ${q} 件 · 原葉ヒット ${h} 箇所 · 処理時間 ${ms} ms`,
    parallelBtn: (n) => `諸本並観 (${n})`,
    noHit: "公開対象回に該当なし（または当該鈔本の欠回）",
    folioFmt: (p) => `第 ${p} 葉`,
    openBook: "閲覧",
    legSame: "朱枠：一致字",
    legDiff: "金枠：異文・鈔本俗字",
    loading: "画像を読み込み中…", focus: "該当箇所に戻る", mirador: "Mirador で開く",
    stageIdle: "原本画像の閲覧",
    stageParallel: (q, n) => `対校箇所：「${q}」 — ${n} 種の善本原葉を同時表示中`
  }
};

const PRESET_QUERIES = [
  "细看形容与众各别，两弯似蹙非蹙罥烟眉，一双似喜非喜含情目，态生两靥之愁，娇袭一身之病",
  "自荣公死后，长子贾代善袭了官，娶的也是金陵世勋史侯家的小姐为妻，生了两个儿子",

  "通灵宝玉\n绛珠草\n冷子兴\n花气袭人知昼暖"
];

let LANG = (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'zh';
let BUNDLE = null;
let CMAP = {};
let PAGES_INDEX = {};
let SELECTED_EDS = new Set();
let LAST_RESULTS = null;
let VIEWERS = [];
let SHOW_BOXES = true;

const PUNCT_RE = /[\s，。、；：？！“”‘’「」『』﹃﹄（）()\[\]【】《》〈〉—…·.,:;?!"'`~\\/\-*&^%$#@+=<>|〇○uoc]/g;

function normStr(s) {
  const clean = s.replace(PUNCT_RE, '');
  let out = '';
  for (const ch of clean) {
    out += (CMAP[ch] || ch);
  }
  return out;
}

// 最长公共连续块序列匹配（浏览器端高速实现 Ratcliff/Obershelp 局部对齐）
function matchingBlocks(a, b) {
  const blocks = [];
  function recurse(alo, ahi, blo, bhi) {
    let bestI = alo, bestJ = blo, bestSize = 0;
    for (let i = alo; i < ahi; i++) {
      for (let j = blo; j < bhi; j++) {
        let k = 0;
        while (i + k < ahi && j + k < bhi && a[i + k] === b[j + k]) k++;
        if (k > bestSize) { bestSize = k; bestI = i; bestJ = j; }
      }
    }
    if (bestSize > 0) {
      if (alo < bestI && blo < bestJ) recurse(alo, bestI, blo, bestJ);
      blocks.push({ a: bestI, b: bestJ, size: bestSize });
      if (bestI + bestSize < ahi && bestJ + bestSize < bhi) recurse(bestI + bestSize, ahi, bestJ + bestSize, bhi);
    }
  }
  recurse(0, a.length, 0, b.length);
  return blocks;
}

function getBox(flat, idx) {
  const b = idx * 4;
  return [flat[b], flat[b + 1], flat[b + 2], flat[b + 3]];
}

function searchInEdition(edId, query) {
  const pages = PAGES_INDEX[edId] || [];
  const qNorm = normStr(query);
  const qLen = qNorm.length;
  if (qLen < 2 || !pages.length) return [];

  const edMeta = BUNDLE.editions.find(e => e.ed_id === edId);
  const hits = [];

  if (qLen <= 5) {
    for (let idx = 0; idx < pages.length; idx++) {
      const pg = pages[idx];
      const nxt = (idx + 1 < pages.length && pages[idx + 1].pno === pg.pno + 1) ? pages[idx + 1] : null;
      const combNorm = pg.norm + (nxt ? nxt.norm.slice(0, 18) : '');
      const combOrig = pg.orig + (nxt ? nxt.orig.slice(0, 18) : '');

      let pos = 0;
      while (true) {
        const f = combNorm.indexOf(qNorm, pos);
        if (f === -1 || f >= pg.norm.length) break;
        const endI = f + qLen;
        const sliceEnd = Math.min(endI, pg.norm.length);
        const cBoxes = [];
        const qClean = query.replace(PUNCT_RE, '');
        for (let k = f; k < sliceEnd; k++) {
          const origCh = pg.orig[k];
          const qCh = qClean[k - f] || '';
          const isVar = (origCh !== qCh && (CMAP[origCh] || origCh) === (CMAP[qCh] || qCh) && origCh !== qCh);
          cBoxes.push({ c: origCh, xywh: getBox(pg.flat, k), v: origCh !== qCh });
        }
        hits.push(packHit(edMeta, pg, f, endI, combOrig, cBoxes, 1.0));
        if (hits.length >= 3) return hits;
        pos = f + qLen;
      }
    }
    return hits;
  }

  // 长句跨异文二阶段对齐
  const qBigrams = new Set();
  for (let i = 0; i < qLen - 1; i++) qBigrams.add(qNorm.slice(i, i + 2));

  const scored = [];
  for (let idx = 0; idx < pages.length; idx++) {
    let hitCnt = 0;
    const pg = pages[idx];
    qBigrams.forEach(bg => { if (pg.bigrams.has(bg)) hitCnt++; });
    if (hitCnt > 0) scored.push([hitCnt, idx]);
  }
  scored.sort((a, b) => b[0] - a[0]);

  const cands = [];
  for (const [, idx] of scored.slice(0, 18)) {
    const pg = pages[idx];
    const nxt = (idx + 1 < pages.length && pages[idx + 1].pno === pg.pno + 1) ? pages[idx + 1] : null;
    const combNorm = pg.norm + (nxt ? nxt.norm.slice(0, 75) : '');
    const combOrig = pg.orig + (nxt ? nxt.orig.slice(0, 75) : '');

    const win = Math.min(combNorm.length, Math.max(qLen + 10, Math.floor(qLen * 1.38)));
    const step = Math.max(1, Math.floor(qLen / 5));
    let bestRatio = 0, bestW = null;

    for (let s = 0; s < Math.max(1, combNorm.length - Math.floor(qLen / 3)); s += step) {
      const sub = combNorm.slice(s, s + win);
      const ms = matchingBlocks(qNorm, sub);
      if (!ms.length) continue;
      const matchedQ = ms.reduce((acc, m) => acc + m.size, 0);
      const spanB = (ms[ms.length - 1].b + ms[ms.length - 1].size) - ms[0].b;
      const compact = Math.min(1.0, (qLen * 1.35) / Math.max(spanB, qLen));
      const ratio = (matchedQ / qLen) * compact;
      if (ratio > bestRatio) { bestRatio = ratio; bestW = { s, sub, ms }; }
    }

    if (bestW && bestRatio >= 0.56) {
      const { s, sub, ms } = bestW;
      const subS = Math.max(0, ms[0].b - ms[0].a);
      const lastM = ms[ms.length - 1];
      const subE = Math.min(sub.length, lastM.b + lastM.size + (qLen - (lastM.a + lastM.size)));
      const absS = s + subS, absE = s + subE;
      if (absE <= absS) continue;

      const nP1 = Math.max(0, Math.min(absE, pg.norm.length) - absS);
      const nP2 = Math.max(0, absE - Math.max(absS, pg.norm.length));
      const targetPg = (nP1 >= nP2 || !nxt) ? pg : nxt;

      const matchedOrig = combOrig.slice(absS, absE);
      const qClean = query.replace(PUNCT_RE, '');
      const exactSet = new Set();
      matchingBlocks(qClean, matchedOrig).forEach(m => {
        for (let k = m.b; k < m.b + m.size; k++) exactSet.add(k);
      });

      const cBoxes = [];
      for (let k = absS; k < absE; k++) {
        const origCh = combOrig[k];
        // 若简繁归一相同且非异文词，只在异文或特殊俗字处标金框
        const isDiff = !exactSet.has(k - absS) && (CMAP[origCh] !== CMAP[qClean[k - absS] || '']);
        if (targetPg.pno === pg.pno && k < pg.norm.length) {
          cBoxes.push({ c: origCh, xywh: getBox(pg.flat, k), v: !exactSet.has(k - absS) });
        } else if (nxt && targetPg.pno === nxt.pno && k >= pg.norm.length) {
          const nk = k - pg.norm.length;
          if (nk < nxt.norm.length) cBoxes.push({ c: origCh, xywh: getBox(nxt.flat, nk), v: !exactSet.has(k - absS) });
        }
      }
      if (!cBoxes.length) continue;
      cands.push([bestRatio, targetPg.pno, packHit(edMeta, targetPg, absS, absE, combOrig, cBoxes, bestRatio)]);
    }
  }

  cands.sort((a, b) => b[0] - a[0]);
  const seen = new Set();
  for (const [, pno, rec] of cands) {
    if (seen.has(pno)) continue;
    seen.add(pno);
    hits.push(rec);
    if (hits.length >= 3) break;
  }
  return hits;
}

function packHit(edMeta, pg, absS, absE, combOrig, cBoxes, score) {
  const xs = cBoxes.flatMap(b => [b.xywh[0], b.xywh[0] + b.xywh[2]]);
  const ys = cBoxes.flatMap(b => [b.xywh[1], b.xywh[1] + b.xywh[3]]);
  const rxywh = [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
  return {
    ed_id: edMeta.ed_id,
    mid: edMeta.mid,
    zh_name: edMeta.zh_name,
    ja_name: edMeta.ja_name,
    page_no: pg.pno,
    banxin: pg.banxin,
    score: Math.round(score * 100) / 100,
    context_left: combOrig.slice(Math.max(0, absS - 10), absS),
    matched_text: combOrig.slice(absS, absE),
    context_right: combOrig.slice(absE, absE + 12),
    canvas_w: pg.w,
    canvas_h: pg.h,
    region_xywh: rxywh,
    char_boxes: cBoxes,
    img_url: `${BUNDLE.cos_base}/images/${edMeta.ed_id}/page_${String(pg.pno).padStart(4, '0')}.jpg`,
    canvas_id: `${BUNDLE.cos_base}/iiif/3/${edMeta.ed_id}/canvas/p${pg.pno}`,
    manifest_url: edMeta.manifest_url
  };
}

function editionLabel(ed) {
  return LANG === 'ja' ? ed.ja_name.split('（')[0] : ed.zh_name;
}

function updateStageCaption() {
  const el = document.getElementById('stageCaption');
  const {query, count} = el.dataset;
  el.textContent = query ? I18N[LANG].stageParallel(query, Number(count)) : I18N[LANG].stageIdle;
}

function applyLangUI() {
  const t = I18N[LANG];
  document.title = t.title;
  const loading = document.getElementById('loadingStage');
  if (loading) loading.textContent = t.loading;
  document.documentElement.lang = LANG === 'ja' ? 'ja' : 'zh-CN';
  document.getElementById('langZh').classList.toggle('active', LANG === 'zh');
  document.getElementById('langJa').classList.toggle('active', LANG === 'ja');
  document.getElementById('uiTitle').textContent = t.title;
  document.getElementById('uiPilotBadge').textContent = t.pilot;
  document.getElementById('tabSearchBtn').textContent = t.tabSearch;
  document.getElementById('tabShelfBtn').textContent = t.tabShelf;
  document.getElementById('colAutoBtn').textContent = t.colAuto;
  document.getElementById('col2Btn').textContent = t.col2;
  document.getElementById('col1Btn').textContent = t.col1;
  document.getElementById('boxBtn').textContent = t.boxBtn;
  document.getElementById('scopeNotice').textContent = t.scope;
  document.getElementById('composerLabel').textContent = t.composerLabel;
  document.getElementById('searchBtn').textContent = t.searchBtn;
  document.getElementById('legSame').textContent = t.legSame;
  document.getElementById('legDiff').textContent = t.legDiff;
  updateStageCaption();

  document.getElementById('presetBar').innerHTML = t.presets.map((lbl, i) =>
    `<button class="preset-chip" onclick="loadPreset(${i})">${esc(lbl)}</button>`
  ).join('');

  if (BUNDLE) {
    document.querySelectorAll('.iiif-win').forEach(win => {
      const ed = BUNDLE.editions.find(book => book.ed_id === win.dataset.edition);
      win.querySelector('.win-ed').textContent = editionLabel(ed);
      win.querySelector('.focus-btn').title = t.focus;
      win.querySelector('.mirador-link').title = t.mirador;
    });
    renderWitnessPills();
    renderCatalog();
    if (LAST_RESULTS) renderApparatus(LAST_RESULTS);
  }
}

function setLang(l) {
  LANG = l;
  applyLangUI();
}

function loadPreset(i) {
  document.getElementById('queriesInput').value = PRESET_QUERIES[i];
  executeBatchSearch();
}

function switchDrawer(mode, btn) {
  btn.parentElement.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + mode).classList.add('active');
}

function setCols(mode, btn) {
  btn.parentElement.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('windowsGrid').className = 'windows-grid cols-' + mode;
  setTimeout(() => VIEWERS.forEach(v => v.viewport && v.viewport.goHome(false)), 60);
}

function toggleBoxes() {
  SHOW_BOXES = !SHOW_BOXES;
  document.getElementById('galleryStage').classList.toggle('hide-boxes', !SHOW_BOXES);
  document.getElementById('boxBtn').classList.toggle('off', !SHOW_BOXES);
}

document.addEventListener('keydown', (e) => {
  if ((e.key === 'b' || e.key === 'B') && !['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) toggleBoxes();
});

async function boot() {
  applyLangUI();
  const res = await fetch('./data/showcase_bundle.json');
  BUNDLE = await res.json();

  const pairs = BUNDLE.cmap_pairs || '';
  for (let i = 0; i < pairs.length; i += 2) {
    CMAP[pairs[i]] = pairs[i + 1];
  }

  BUNDLE.editions.forEach(ed => {
    SELECTED_EDS.add(ed.ed_id);
    const rawPages = BUNDLE.pages[ed.ed_id] || [];
    PAGES_INDEX[ed.ed_id] = rawPages.map(r => {
      const norm = r[4];
      const bgs = new Set();
      for (let i = 0; i < norm.length - 1; i++) bgs.add(norm.slice(i, i + 2));
      return { pno: r[0], w: r[1], h: r[2], banxin: r[3], norm, orig: r[5], flat: r[6], bigrams: bgs };
    });
  });

  document.getElementById('iiifColLink').href = BUNDLE.collection_url;
  document.getElementById('miradorTopLink').href =
    `https://projectmirador.org/embed/?iiif-content=${encodeURIComponent(BUNDLE.collection_url)}`;

  renderWitnessPills();
  renderCatalog();
  executeBatchSearch();
}

function renderWitnessPills() {
  document.getElementById('witnessBar').innerHTML = BUNDLE.editions.map(ed => {
    const on = SELECTED_EDS.has(ed.ed_id);
    return `<span class="wit-pill ${on ? 'checked' : ''}" onclick="toggleWit('${ed.ed_id}')">
      <i class="dot"></i>${esc(editionLabel(ed))}
    </span>`;
  }).join('');
}

function toggleWit(edId) {
  if (SELECTED_EDS.has(edId) && SELECTED_EDS.size > 1) SELECTED_EDS.delete(edId);
  else SELECTED_EDS.add(edId);
  renderWitnessPills();
}

function renderCatalog() {
  const t = I18N[LANG];
  document.getElementById('catalogList').innerHTML = BUNDLE.editions.map(ed => {
    const title = LANG === 'ja' ? ed.ja_name : ed.zh_name;
    const desc = LANG === 'ja' ? ed.ja_desc : ed.zh_desc;
    const miradorUrl = `https://projectmirador.org/embed/?iiif-content=${encodeURIComponent(ed.manifest_url)}`;
    return `<div class="cat-item">
      <div>
        <h3 class="cat-title">${esc(title)} <span class="cat-id">${ed.mid}</span></h3>
        <p class="cat-desc">${esc(desc)}</p>
        <div class="cat-meta">
          <a href="${ed.manifest_url}" target="_blank">IIIF v3 Manifest ↗</a>
          <a href="${miradorUrl}" target="_blank">Mirador 3 ↗</a>
        </div>
      </div>
      <button class="sub-btn" onclick="openBookLeaf('${ed.ed_id}', ${ed.first_leaf})">${t.openBook}</button>
    </div>`;
  }).join('');
}

function executeBatchSearch() {
  if (!BUNDLE) return;
  const queries = document.getElementById('queriesInput').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!queries.length) return;

  const t0 = performance.now();
  const results = [];
  for (const q of queries.slice(0, 50)) {
    const byEd = {};
    let total = 0;
    for (const ed of BUNDLE.editions) {
      if (!SELECTED_EDS.has(ed.ed_id)) continue;
      const hs = searchInEdition(ed.ed_id, q);
      byEd[ed.ed_id] = hs;
      total += hs.length;
    }
    results.push({ query: q, total_hits: total, by_edition: byEd });
  }
  const elapsed = (performance.now() - t0).toFixed(1);
  LAST_RESULTS = { query_count: results.length, elapsed_ms: elapsed, results };
  renderApparatus(LAST_RESULTS);
  if (results.length > 0) openParallel(0);
}

function renderApparatus(data) {
  const t = I18N[LANG];
  const sumHits = data.results.reduce((s, r) => s + r.total_hits, 0);
  let html = `<div class="meta-strip"><span>${t.statFmt(data.query_count, sumHits, data.elapsed_ms)}</span></div>`;

  data.results.forEach((item, qi) => {
    const flat = [];
    Object.values(item.by_edition).forEach(arr => arr.forEach(h => flat.push(h)));
    const idxStr = String(qi + 1).padStart(2, '0');

    html += `<div class="app-entry" id="entry-${qi}">
      <div class="app-head">
        <div class="app-lemma">
          <span class="app-idx">${idxStr}</span>
          <span class="app-qtext" title="${esc(item.query)}">${esc(item.query)}</span>
        </div>
        ${flat.length ? `<button class="btn-parallel" onclick="openParallel(${qi})">${t.parallelBtn(flat.length)}</button>` : ''}
      </div>`;

    if (!flat.length) {
      html += `<div style="padding:11px 14px;font-size:13px;color:var(--stone)">${t.noHit}</div>`;
    } else {
      html += `<table class="rdg-table"><tbody>`;
      flat.forEach(h => {
        const shortWit = editionLabel(h).replace(/本$/, '');
        const midHtml = h.char_boxes.map(cb =>
          cb.v ? `<span class="ch-diff">${esc(cb.c)}</span>` : `<span>${esc(cb.c)}</span>`
        ).join('');
        const bxHtml = h.banxin ? `<span class="rdg-banxin">${esc(h.banxin)}</span>` : '';
        const payload = JSON.stringify(h).replace(/'/g, "&#39;");

        html += `<tr class="rdg-row" onclick='openSingleHit(${payload}, this)'>
          <td class="rdg-wit">
            <span class="wit-stamp">${esc(shortWit)}</span>
            <span class="wit-folio">${t.folioFmt(h.page_no)}</span>
          </td>
          <td class="rdg-text">
            <span class="ctx">${esc(h.context_left)}</span>${midHtml}<span class="ctx">${esc(h.context_right)}</span>${bxHtml}
          </td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;
  });
  document.getElementById('apparatusList').innerHTML = html;
}

function destroyViewers() {
  const caption = document.getElementById('stageCaption');
  delete caption.dataset.query;
  delete caption.dataset.count;
  updateStageCaption();
  VIEWERS.forEach(v => { try { v.destroy(); } catch (e) {} });
  VIEWERS = [];
}

function openParallel(qi) {
  const item = LAST_RESULTS && LAST_RESULTS.results[qi];
  if (!item) return;
  document.querySelectorAll('.app-entry').forEach((el, i) => el.classList.toggle('active-entry', i === qi));
  const hits = [];
  Object.values(item.by_edition).forEach(arr => { if (arr && arr.length) hits.push(arr[0]); });
  if (!hits.length) return;

  destroyViewers();
  const grid = document.getElementById('windowsGrid');
  grid.innerHTML = '';
  const qShort = item.query.length > 36 ? item.query.slice(0, 36) + '…' : item.query;
  Object.assign(document.getElementById('stageCaption').dataset, { query: qShort, count: hits.length });
  updateStageCaption();
  hits.forEach((h, i) => mountWin(grid, h, i));
}

function openSingleHit(hit, rowEl) {
  document.querySelectorAll('.rdg-row').forEach(el => el.classList.remove('focused'));
  if (rowEl) rowEl.classList.add('focused');
  destroyViewers();
  const grid = document.getElementById('windowsGrid');
  grid.innerHTML = '';
  mountWin(grid, hit, 0);
}

function openBookLeaf(edId, pno) {
  const ed = BUNDLE.editions.find(e => e.ed_id === edId);
  if (!ed) return;
  destroyViewers();
  const grid = document.getElementById('windowsGrid');
  grid.innerHTML = '';
  mountWin(grid, {
    ed_id: ed.ed_id, zh_name: ed.zh_name, page_no: pno, banxin: '',
    canvas_w: ed.sample_w, canvas_h: ed.sample_h,
    img_url: `${BUNDLE.cos_base}/images/${ed.ed_id}/page_${String(pno).padStart(4, '0')}.jpg`,
    manifest_url: ed.manifest_url,
    char_boxes: [], region_xywh: null
  }, 0);
}

function mountWin(grid, hit, idx) {
  const ed = BUNDLE.editions.find(e => e.ed_id === hit.ed_id);
  const miradorUrl = `https://projectmirador.org/embed/?iiif-content=${encodeURIComponent(hit.manifest_url)}`;
  const win = document.createElement('div');
  win.className = 'iiif-win';
  win.dataset.edition = hit.ed_id;
  const id = `osd-${idx}-${Date.now()}`;

  win.innerHTML = `
    <div class="win-hud">
      <div class="win-label">
        <span class="win-ed">${esc(editionLabel(ed))}</span>
        <span class="win-banxin">${hit.banxin ? esc(hit.banxin) : ''}</span>
      </div>
      <div class="win-nav">
        <button class="hud-btn" onclick="stepLeaf('${id}', '${hit.ed_id}', -1)">‹</button>
        <input class="hud-pno" id="${id}-inp" value="${hit.page_no}" onchange="jumpLeaf('${id}', '${hit.ed_id}', this.value)" />
        <span class="hud-total">/ ${ed.max_pno}</span>
        <button class="hud-btn" onclick="stepLeaf('${id}', '${hit.ed_id}', 1)">›</button>
        <button class="hud-btn focus-btn" title="${I18N[LANG].focus}" onclick="refocus('${id}')">⌖</button>
        <a class="hud-btn mirador-link" href="${miradorUrl}" target="_blank" title="${I18N[LANG].mirador}">Mirador</a>
      </div>
    </div>
    <div class="osd-mount" id="${id}"></div>
  `;
  grid.appendChild(win);

  const viewer = OpenSeadragon({
    id,
    showNavigationControl: false,
    gestureSettingsMouse: { clickToZoom: false, scrollToZoom: true },
    animationTime: 0.6,
    minZoomImageRatio: 0.72,
    maxZoomPixelRatio: 4.0,
    tileSources: { type: 'image', url: hit.img_url, buildPyramid: false }
  });
  viewer._meta = { ed, focusBounds: null };

  viewer.addHandler('open', () => {
    (hit.char_boxes || []).forEach(cb => {
      const [x, y, w, h] = cb.xywh;
      const el = document.createElement('div');
      el.className = cb.v ? 'iiif-box-var' : 'iiif-box-exact';
      el.title = cb.c;
      viewer.addOverlay({ element: el, location: viewer.viewport.imageToViewportRectangle(x, y, w, h) });
    });
    if (hit.region_xywh && hit.char_boxes && hit.char_boxes.length > 0) {
      const [rx, ry, rw, rh] = hit.region_xywh;
      const padX = Math.max(250, rw * 1.35), padY = Math.max(170, rh * 0.16);
      const fx = Math.max(0, rx - padX), fy = Math.max(0, ry - padY);
      const fw = Math.min(hit.canvas_w - fx, rw + padX * 2);
      const fh = Math.min(hit.canvas_h - fy, rh + padY * 2);
      const b = viewer.viewport.imageToViewportRectangle(fx, fy, fw, fh);
      viewer._meta.focusBounds = b;
      viewer.viewport.fitBounds(b, true);
    }
  });
  VIEWERS.push(viewer);
}

function refocus(id) {
  const v = VIEWERS.find(x => x.id === id);
  if (v && v._meta.focusBounds) v.viewport.fitBounds(v._meta.focusBounds, false);
  else if (v) v.viewport.goHome(false);
}

function stepLeaf(id, edId, d) {
  const v = VIEWERS.find(x => x.id === id);
  if (!v) return;
  const pnos = v._meta.ed.showcase_pnos || [];
  const inp = document.getElementById(id + '-inp');
  const cur = parseInt(inp.value || '1', 10);
  if (pnos.length) {
    const ci = pnos.indexOf(cur);
    const nextIdx = ci >= 0 ? Math.max(0, Math.min(pnos.length - 1, ci + d)) : 0;
    jumpLeaf(id, edId, pnos[nextIdx]);
  } else {
    jumpLeaf(id, edId, cur + d);
  }
}

function jumpLeaf(id, edId, target) {
  const v = VIEWERS.find(x => x.id === id);
  if (!v) return;
  const ed = v._meta.ed;
  const pnos = ed.showcase_pnos || [];
  let pno = parseInt(target || ed.first_leaf, 10);
  if (pnos.length && !pnos.includes(pno)) {
    pno = pnos.reduce((prev, curr) => Math.abs(curr - pno) < Math.abs(prev - pno) ? curr : prev);
  }
  document.getElementById(id + '-inp').value = pno;
  v.clearOverlays();
  v._meta.focusBounds = null;
  v.open({ type: 'image', url: `${BUNDLE.cos_base}/images/${edId}/page_${String(pno).padStart(4, '0')}.jpg`, buildPyramid: false });
}

// 导出符合 W3C / IIIF v3 国际标准的 Web Annotation JSON-LD！
function exportWebAnnotation() {
  if (!LAST_RESULTS) return;
  const items = [];
  LAST_RESULTS.results.forEach((qItem, qi) => {
    Object.values(qItem.by_edition).forEach(arr => {
      arr.forEach((h, hi) => {
        const [x, y, w, hgt] = h.region_xywh;
        items.push({
          id: `urn:hlm-pilot:anno:${qi + 1}:${h.ed_id}:p${h.page_no}:${hi + 1}`,
          type: "Annotation",
          motivation: "highlighting",
          body: [
            { type: "TextualBody", value: h.matched_text, language: "zh-Hant", purpose: "transcribing" },
            { type: "TextualBody", value: `Query: ${qItem.query}`, purpose: "commenting" }
          ],
          target: {
            source: h.canvas_id,
            partOf: { id: h.manifest_url, type: "Manifest", label: { zh: [h.zh_name], ja: [h.ja_name] } },
            selector: { type: "FragmentSelector", conformsTo: "http://www.w3.org/TR/media-frags/", value: `xywh=pixel:${x},${y},${w},${hgt}` }
          }
        });
      });
    });
  });
  const annoPage = {
    "@context": "http://iiif.io/api/presentation/3/context.json",
    id: "urn:hlm-pilot:annotation-page:search-export",
    type: "AnnotationPage",
    items
  };
  const blob = new Blob([JSON.stringify(annoPage, null, 2)], { type: 'application/ld+json;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hongloumeng-iiif-annotations.jsonld';
  a.click();
}

function exportCSV() {
  if (!LAST_RESULTS) return;
  const rows = [['Query', 'Edition', 'Material_ID', 'Leaf_Page', 'Banxin_Folio', 'Score', 'Context_Before', 'Matched_Transcription', 'Context_After', 'IIIF_Canvas_Target']];
  LAST_RESULTS.results.forEach(qItem => {
    Object.values(qItem.by_edition).forEach(arr => {
      arr.forEach(h => {
        const [x, y, w, hgt] = h.region_xywh;
        rows.push([
          qItem.query, h.zh_name, h.mid, h.page_no, h.banxin || '',
          Math.round(h.score * 100) + '%', h.context_left, h.matched_text, h.context_right,
          `${h.canvas_id}#xywh=${x},${y},${w},${hgt}`
        ]);
      });
    });
  });
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'hongloumeng-collation-citations.csv';
  a.click();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

boot();
