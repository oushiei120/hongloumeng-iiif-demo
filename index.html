<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>红楼梦诸本对校 · IIIF 善本影像检索</title>
<script src="./vendor/openseadragon.min.js"></script>
<script src="./cite.js"></script>
<script src="./changelog.js"></script>
<style>
  :root {
    --washi: #f7f4ee;
    --washi-pure: #fcfbf8;
    --sumi: #1c1917;
    --sumi-soft: #4a433c;
    --stone: #6f665c;
    --hairline: rgba(42, 35, 29, 0.12);
    --cinnabar: #a83228;
    --kin: #b07418;
    --kin-wash: rgba(196, 138, 36, 0.18);
    --stage-bg: #11100f;
    --stage-card: #181614;
    --stage-border: rgba(255, 248, 235, 0.10);
    --serif: "Hiragino Mincho ProN", "YuMincho", "Songti SC", "STSong", "Noto Serif CJK JP", "Noto Serif CJK SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "Noto Sans JP", "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }
  ::selection { background: rgba(168, 50, 40, 0.18); color: var(--sumi); }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid #d98a2b; outline-offset: 1px; }

  body {
    margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--washi); color: var(--sumi); font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶栏 ---------- */
  header {
    min-height: 50px; background: #161412; color: #efeae1; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    border-bottom: 1px solid rgba(198, 173, 138, 0.22); gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
  .seal-mark {
    width: 26px; height: 26px; border: 1.5px solid #c94a3f; color: #e05a4e;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border-radius: 2px; background: rgba(168, 50, 40, 0.12); flex-shrink: 0;
  }
  .brand-title {
    margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.08em; color: #f5f1e8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .pilot-tag {
    font-family: var(--sans); font-size: 11px; color: #d8c39e;
    border: 1px solid rgba(216, 195, 158, 0.35); padding: 1px 7px; border-radius: 2px;
    background: rgba(216, 195, 158, 0.08); white-space: nowrap; flex-shrink: 0;
  }
  .nav-bar { display: flex; align-items: center; gap: 8px; font-family: var(--sans); flex-shrink: 0; }

  .seg-group {
    display: inline-flex; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px; padding: 2px; gap: 2px; font-family: var(--sans);
  }
  .seg-btn {
    border: none; background: transparent; color: #b3aa9e; padding: 5px 11px;
    border-radius: 3px; font-size: 12.5px; transition: all 0.15s; white-space: nowrap;
  }
  .seg-btn:hover { color: #f2ece1; }
  .seg-btn.active { background: rgba(245, 238, 226, 0.17); color: #fff; font-weight: 500; }

  .ghost-action {
    border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #d6cdc0;
    padding: 5px 11px; border-radius: 5px; font-size: 12.5px; font-family: var(--sans);
    text-decoration: none; transition: all 0.15s; white-space: nowrap;
  }
  .ghost-action:hover { border-color: rgba(224, 90, 78, 0.65); color: #fff; background: rgba(168, 50, 40, 0.18); }
  .ghost-action.off { color: #8d8478; }

  /* ---------- 主体 ---------- */
  .workspace { flex: 1; display: flex; min-height: 0; position: relative; }

  .drawer {
    width: 460px; flex-shrink: 0; background: var(--washi);
    border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0;
  }

  .drawer-tabs { display: flex; border-bottom: 1px solid var(--hairline); background: #efe9dd; flex-shrink: 0; }
  .dtab {
    flex: 1; border: none; background: transparent; padding: 10px 8px 9px; font-family: var(--sans);
    font-size: 13px; color: var(--stone); border-bottom: 2px solid transparent;
  }
  .dtab:hover { color: var(--sumi); }
  .dtab.active { color: var(--sumi); font-weight: 600; border-bottom-color: var(--cinnabar); background: var(--washi-pure); }

  .pane { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .pane.active { display: flex; }

  .composer { padding: 14px 18px 14px; background: var(--washi-pure); border-bottom: 1px solid var(--hairline); flex-shrink: 0; }
  .intro { margin: 0 0 12px; font-family: var(--sans); font-size: 12.5px; line-height: 1.65; color: var(--sumi-soft); }
  .intro a, .link-btn {
    color: var(--cinnabar); background: none; border: none; padding: 0; font-family: var(--sans); font-size: inherit;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .field-label { display: block; font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--sumi-soft); margin: 0 0 6px; }

  textarea#queriesInput {
    display: block; width: 100%; height: 96px; resize: vertical; padding: 9px 11px;
    border: 1px solid rgba(42, 35, 29, 0.22); border-radius: 4px;
    background: var(--washi); color: var(--sumi);
    font-family: var(--serif); font-size: 15px; line-height: 1.62;
    outline: none; transition: border-color 0.18s, background 0.18s;
  }
  textarea#queriesInput:focus { border-color: var(--cinnabar); background: #fff; }
  textarea#queriesInput::placeholder { color: #a79d91; }

  .preset-row { display: flex; gap: 6px; align-items: baseline; margin-top: 8px; font-family: var(--sans); font-size: 12px; color: var(--stone); }
  .preset-row > span { flex-shrink: 0; }
  .preset-bar { display: flex; gap: 5px; flex-wrap: wrap; }
  .preset-chip {
    border: 1px solid rgba(42, 35, 29, 0.14); background: var(--washi); color: var(--sumi-soft); font-family: var(--serif);
    font-size: 12.5px; padding: 2px 9px; border-radius: 999px;
  }
  .preset-chip:hover { color: var(--cinnabar); border-color: var(--cinnabar); background: #fff; }

  .wit-block { margin-top: 13px; }
  .witness-bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .wit-pill {
    font-family: var(--serif); font-size: 13px; padding: 4px 10px 4px 8px; border-radius: 3px;
    border: 1px solid rgba(42, 35, 29, 0.2); background: transparent; color: var(--stone);
    user-select: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .wit-pill .box {
    width: 12px; height: 12px; border-radius: 2px; border: 1.3px solid rgba(42,35,29,0.35);
    display: inline-flex; align-items: center; justify-content: center; font-family: var(--sans); font-size: 10px; line-height: 1; color: transparent;
  }
  .wit-pill.checked { background: #25211e; border-color: #25211e; color: #f7f3eb; }
  .wit-pill.checked .box { background: #d95348; border-color: #d95348; color: #fff; }

  .composer-foot { display: flex; align-items: center; margin-top: 13px; gap: 10px; }
  .search-submit {
    flex: 1; background: var(--cinnabar); color: #fcf9f2; border: none; padding: 10px 14px;
    border-radius: 4px; font-family: var(--serif); font-size: 14.5px; font-weight: 600; letter-spacing: 0.1em;
  }
  .search-submit:hover { background: #8e261d; }
  .search-submit:disabled { background: #b9aea2; cursor: default; }
  .kbd-hint { font-family: var(--sans); font-size: 11.5px; color: var(--stone); white-space: nowrap; }

  .apparatus-scroll { flex: 1; overflow-y: auto; padding: 14px 18px 32px; }
  .meta-strip {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap;
    font-family: var(--sans); font-size: 12px; color: var(--stone);
    padding-bottom: 9px; margin-bottom: 12px; border-bottom: 1px solid var(--hairline);
  }
  .export-links { display: inline-flex; gap: 9px; align-items: baseline; }
  .notice { font-family: var(--sans); font-size: 13px; color: var(--sumi-soft); line-height: 1.7; padding: 6px 2px; }
  .notice .sub-btn { margin-top: 8px; }

  .app-entry { background: var(--washi-pure); border: 1px solid var(--hairline); border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
  .app-entry.active-entry { border-color: rgba(168, 50, 40, 0.45); box-shadow: 0 4px 16px rgba(28, 25, 23, 0.06); }
  .app-head {
    padding: 9px 13px; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: rgba(237, 231, 220, 0.45);
  }
  .app-lemma { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .app-idx { font-family: "Georgia", serif; font-size: 12px; color: var(--cinnabar); font-style: italic; }
  .app-qtext { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-parallel {
    flex-shrink: 0; border: 1px solid rgba(168, 50, 40, 0.45); background: transparent;
    color: var(--cinnabar); font-family: var(--sans); font-size: 12px; padding: 4px 10px; border-radius: 3px;
  }
  .btn-parallel:hover, .app-entry.active-entry .btn-parallel { background: var(--cinnabar); color: #fff; border-color: var(--cinnabar); }

  .rdg-table { width: 100%; border-collapse: collapse; }
  .rdg-row { border-bottom: 1px solid rgba(42, 35, 29, 0.07); cursor: pointer; }
  .rdg-row:last-child { border-bottom: none; }
  .rdg-row:hover { background: rgba(196, 138, 36, 0.07); }
  .rdg-row.focused { background: rgba(168, 50, 40, 0.07); box-shadow: inset 3px 0 0 var(--cinnabar); }
  .rdg-row.is-missing { cursor: default; }
  .rdg-row.is-missing:hover { background: transparent; }
  .rdg-wit { width: 84px; vertical-align: top; padding: 10px 8px 10px 13px; white-space: nowrap; }
  .wit-stamp {
    display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--cinnabar);
    border: 1px solid rgba(168, 50, 40, 0.4); padding: 0 5px; border-radius: 2px; background: rgba(168, 50, 40, 0.04);
  }
  .wit-stamp.is-aligned { color: #195a7a; border-color: rgba(25, 90, 122, 0.45); background: rgba(56, 189, 248, 0.09); }
  .wit-stamp.is-missing { color: #9a9086; border-color: rgba(42, 35, 29, 0.18); background: transparent; font-weight: 500; }
  .wit-folio { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--stone); margin-top: 4px; }
  .rdg-text { padding: 9px 13px 10px 4px; font-size: 15px; line-height: 1.7; letter-spacing: 0.03em; }
  .rdg-text.miss { font-family: var(--sans); font-size: 12.5px; color: #9a9086; letter-spacing: 0; }
  .rdg-text .ctx { color: #9d9387; font-size: 13.5px; }
  .rdg-text .ch-diff { color: #8f4f06; background: var(--kin-wash); border-bottom: 1.5px solid rgba(176, 116, 24, 0.7); padding: 0 1px; }
  .rdg-text .ch-aligned { color: #14506e; background: rgba(56, 189, 248, 0.14); border-bottom: 1.5px dashed rgba(25, 90, 122, 0.7); padding: 0 1px; }
  .rdg-align-badge {
    display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 2px;
    font-family: var(--sans); font-size: 11px; color: #195a7a; letter-spacing: 0;
    border: 1px dashed rgba(25, 90, 122, 0.45); background: rgba(56, 189, 248, 0.08); vertical-align: baseline;
  }
  .rdg-banxin {
    display: inline-block; margin-left: 6px; font-family: var(--sans); font-size: 11px; letter-spacing: 0;
    color: var(--stone); border-left: 1px solid var(--hairline); padding-left: 6px;
  }

  .catalog-list { flex: 1; overflow-y: auto; padding: 15px 18px 30px; }
  .cat-item {
    background: var(--washi-pure); border: 1px solid var(--hairline); border-radius: 4px;
    padding: 13px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .cat-title { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cat-id { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--stone); font-weight: 400; }
  .cat-desc { margin: 0; font-size: 13px; color: var(--sumi-soft); line-height: 1.6; }
  .cat-meta { margin-top: 7px; font-family: var(--sans); font-size: 12px; color: var(--stone); display: flex; gap: 12px; flex-wrap: wrap; }
  .cat-meta a { color: var(--cinnabar); text-decoration: none; }
  .cat-meta a:hover { text-decoration: underline; }
  .sub-btn {
    background: transparent; color: var(--sumi-soft); border: 1px solid rgba(42, 35, 29, 0.25);
    padding: 7px 12px; border-radius: 4px; font-family: var(--sans); font-size: 12.5px; white-space: nowrap; flex-shrink: 0;
  }
  .sub-btn:hover { border-color: var(--sumi); color: var(--sumi); background: rgba(42,35,29,0.04); }

  /* ---------- 原页影像区 ---------- */
  .gallery-stage { flex: 1; display: flex; flex-direction: column; background: var(--stage-bg); min-width: 0; }
  .stage-bar {
    min-height: 42px; background: #161412; color: #a89e92; padding: 5px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap;
    font-family: var(--sans); font-size: 12.5px; border-bottom: 1px solid var(--stage-border); flex-shrink: 0;
  }
  .stage-caption { flex: 1 1 180px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cfc6b9; }
  .stage-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .legend { display: inline-flex; gap: 11px; align-items: center; white-space: nowrap; }
  .legend > span { cursor: help; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 1px; margin-right: 5px; vertical-align: -1px; }
  .legend-same { border: 1.5px solid #d1483e; background: rgba(209,72,62,0.18); }
  .legend-diff { border: 1.5px solid #e09f3e; background: rgba(224,159,62,0.3); }
  .legend-aligned { border: 1.5px dashed #38bdf8; background: rgba(56,189,248,0.20); }

  .win-tabs { display: none; gap: 2px; padding: 5px 10px; background: #1b1917; border-bottom: 1px solid var(--stage-border); overflow-x: auto; flex-shrink: 0; }
  .gallery-stage.single .win-tabs:not(:empty) { display: flex; }
  .win-tab {
    border: 1px solid transparent; background: transparent; color: #a89e92; font-family: var(--serif); font-size: 13.5px;
    padding: 4px 12px; border-radius: 4px; white-space: nowrap;
  }
  .win-tab:hover { color: #fff; }
  .win-tab.active { background: rgba(245, 238, 226, 0.14); color: #fff; font-weight: 700; border-color: rgba(255,255,255,0.14); }
  .win-tab.is-aligned::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; margin-left: 6px; vertical-align: 2px; }

  .windows-grid { flex: 1; display: grid; gap: 1px; background: #26221e; min-height: 0; position: relative; }
  .windows-grid.cols-2 { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(0, 1fr); }
  .windows-grid.cols-auto { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .windows-grid.cols-1 { display: block; }
  .windows-grid.cols-1 .iiif-win { position: absolute; inset: 0; visibility: hidden; }
  .windows-grid.cols-1 .iiif-win.is-active { visibility: visible; }

  .iiif-win { position: relative; background: var(--stage-card); overflow: hidden; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .iiif-win.flash::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 20;
    box-shadow: inset 0 0 0 2px #e0a23e; animation: winflash 1.1s ease-out forwards;
  }
  @keyframes winflash { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }

  .win-hud {
    min-height: 38px; padding: 3px 6px 3px 12px; flex-shrink: 0;
    background: #1f1c19; border-bottom: 1px solid var(--stage-border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    color: #ede6da; font-family: var(--sans); font-size: 12px;
  }
  .win-label { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .win-ed { font-family: var(--serif); font-size: 14.5px; font-weight: 700; color: #f7f2e8; white-space: nowrap; }
  .win-align-pill {
    font-family: var(--sans); font-size: 11px; color: #7dd3fc;
    border: 1px dashed rgba(125, 211, 252, 0.55); background: rgba(56, 189, 248, 0.13);
    padding: 0 6px; border-radius: 2px; white-space: nowrap;
  }
  .win-banxin { color: #cbb693; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .win-nav { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
  .hud-btn {
    border: none; background: transparent; color: #d0c7bb; min-width: 28px; height: 28px; padding: 0 7px;
    border-radius: 4px; font-size: 14px; line-height: 28px; text-decoration: none; text-align: center; font-family: var(--sans);
  }
  .hud-btn.txt { font-size: 12px; }
  .hud-btn:hover { background: rgba(255,255,255,0.13); color: #fff; }
  .hud-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.14); margin: 0 4px; }
  .hud-pno {
    width: 46px; height: 24px; background: rgba(0,0,0,0.4); color: #f5efe6; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 3px; padding: 0 3px; text-align: center; font-size: 12px; font-family: "SF Mono", Menlo, monospace;
  }
  .osd-wrap { flex: 1; position: relative; min-height: 0; }
  .osd-mount { position: absolute; inset: 0; }
  .win-status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none;
    color: #8f867a; font-family: var(--sans); font-size: 13px; background: rgba(17,16,15,0.7); padding: 5px 12px; border-radius: 4px;
  }
  .win-status[hidden] { display: none; }

  .iiif-box-exact { border: 1.4px solid rgba(209, 67, 56, 0.86); background: rgba(209, 67, 56, 0.07); border-radius: 1px; }
  .iiif-box-var { border: 1.7px solid rgba(226, 158, 46, 0.95); background: rgba(226, 158, 46, 0.17); border-radius: 1px; box-shadow: 0 0 6px rgba(226, 158, 46, 0.22); }
  .iiif-box-aligned { border: 1.8px dashed rgba(56, 189, 248, 0.95); background: rgba(56, 189, 248, 0.12); border-radius: 2px; box-shadow: 0 0 7px rgba(56, 189, 248, 0.24); }
  .hide-boxes .iiif-box-exact, .hide-boxes .iiif-box-var, .hide-boxes .iiif-box-aligned { opacity: 0 !important; pointer-events: none; }
  .stage-placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; color: #8f867a; font-size: 14px; letter-spacing: 0.04em; padding: 20px; background: var(--stage-bg);
  }
  .stage-placeholder .ghost-action { font-size: 13px; }

  /* ---------- 使用说明 ---------- */
  dialog#helpDialog {
    border: none; border-radius: 8px; padding: 0; width: min(600px, calc(100vw - 28px)); max-height: calc(100dvh - 40px);
    background: var(--washi-pure); color: var(--sumi); box-shadow: 0 24px 70px rgba(0,0,0,0.45);
  }
  dialog#helpDialog::backdrop { background: rgba(15, 13, 11, 0.6); }
  .help-head {
    display: flex; justify-content: space-between; align-items: center; padding: 14px 20px;
    border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--washi-pure);
  }
  .help-head h2 { margin: 0; font-size: 17px; letter-spacing: 0.06em; }
  .help-body { padding: 6px 20px 20px; font-family: var(--sans); font-size: 13.5px; line-height: 1.8; color: var(--sumi-soft); }
  .help-body h3 { font-family: var(--serif); font-size: 14.5px; color: var(--sumi); margin: 16px 0 4px; }
  .help-body p, .help-body ol, .help-body ul { margin: 0 0 4px; }
  .help-body ol, .help-body ul { padding-left: 1.4em; }
  .help-body a { color: var(--cinnabar); }
  .help-body kbd { font-family: "SF Mono", Menlo, monospace; font-size: 12px; border: 1px solid rgba(42,35,29,0.25); border-radius: 3px; padding: 0 5px; background: #fff; }
  .help-body .legend-dot { margin-right: 6px; }

  /* ---------- 手机底部切换 ---------- */
  .mobile-tabs { display: none; }

  @media (max-width: 1180px) {
    .drawer { width: 390px; }
    .legend .lg-text { display: none; }
    .legend-dot { margin-right: 0; }
  }

  @media (max-width: 820px) {
    header { padding: 0 12px; gap: 8px; }
    .pilot-tag { display: none; }
    .brand-title { font-size: 14.5px; letter-spacing: 0.04em; }
    .seg-btn { padding: 5px 8px; }
    .ghost-action { padding: 5px 8px; }
    .drawer, .gallery-stage { position: absolute; inset: 0; width: auto; border-right: none; }
    body:not(.m-stage) .gallery-stage, body:not(.m-stage) .gallery-stage * { visibility: hidden !important; }
    body.m-stage .drawer, body.m-stage .drawer * { visibility: hidden !important; }
    #pane-search.active { display: block; overflow-y: auto; }
    .apparatus-scroll { overflow: visible; }
    .kbd-hint, #layoutGroup { display: none; }
    .stage-bar { padding: 5px 10px; }

function normStr(s) {
  const clean = s.replace(PUNCT_RE, '');

  for (const ch of clean) {

// 最长公共连续块序列匹配（浏览器端高速实现 Ratcliff/Obershelp 局部对齐）
function matchingBlocks(a, b) {
  const blocks = [];
  function recurse(alo, ahi, blo, bhi) {
    let bestI = alo, bestJ = blo, bestSize = 0;
    for (let i = alo; i < ahi; i++) {
      for (let j = blo; j < bhi; j++) {
        let k = 0;
        while (i + k < ahi && j + k < bhi && a[i + k] === b[j + k]) k++;
        if (k > bestSize) { bestSize = k; bestI = i; bestJ = j; }
      }
    }
    if (bestSize > 0) {
      if (alo < bestI && blo < bestJ) recurse(alo, bestI, blo, bestJ);
      blocks.push({ a: bestI, b: bestJ, size: bestSize });
      if (bestI + bestSize < ahi && bestJ + bestSize < bhi) recurse(bestI + bestSize, ahi, bestJ + bestSize, bhi);
    }
  }
  recurse(0, a.length, 0, b.length);
  return blocks;
}

function getBox(flat, idx) {
  const b = idx * 4;
  return [flat[b], flat[b + 1], flat[b + 2], flat[b + 3]];
}

function getChapter(edId, pno, charPos = 0) {
  const rows = (BUNDLE && BUNDLE.chapters && BUNDLE.chapters[edId]) || [];
  for (const [ch, sp, sc, ep, ec] of rows) {
    if ((pno > sp || (pno === sp && charPos >= sc)) && (pno < ep || (pno === ep && charPos <= ec))) return ch;
  }
  return 0;
}

function editionHasChapter(edId, ch) {
  if (!ch || ch <= 0) return true;
  const rows = (BUNDLE && BUNDLE.chapters && BUNDLE.chapters[edId]) || [];
  if (!rows.length) return true;
  for (const r of rows) {
    if (r[0] === ch) return true;
    if ((ch === 17 || ch === 18) && (r[0] === 17 || r[0] === 18)) return true;
  }
  return false;
}

function chaptersCompatible(c1, c2) {
  if (!c1 || !c2) return c1 === c2;
  return c1 === c2 || (Math.min(c1, c2) === 17 && Math.max(c1, c2) === 18);
}

function searchInEdition(edId, query, maxHits = 4) {
  const pages = PAGES_INDEX[edId] || [];
  const qNorm = normStr(query);
  const qLen = qNorm.length;
  if (qLen < 2 || !pages.length) return [];

  const edMeta = BUNDLE.editions.find(e => e.ed_id === edId);
  const hits = [];

  if (qLen <= 5) {
    for (let idx = 0; idx < pages.length; idx++) {
      const pg = pages[idx];
      const nxt = (idx + 1 < pages.length && pages[idx + 1].pno === pg.pno + 1) ? pages[idx + 1] : null;
      const combNorm = pg.norm + (nxt ? nxt.norm.slice(0, 18) : '');
      const combOrig = pg.orig + (nxt ? nxt.orig.slice(0, 18) : '');

      let pos = 0;
      while (true) {
        const f = combNorm.indexOf(qNorm, pos);
        if (f === -1 || f >= pg.norm.length) break;
        const endI = f + qLen;
        const sliceEnd = Math.min(endI, pg.norm.length);
        const cBoxes = [];
        const qClean = query.replace(PUNCT_RE, '');
        for (let k = f; k < sliceEnd; k++) {
          const origCh = pg.orig[k];
          const qCh = qClean[k - f] || '';
          const isVar = (origCh !== qCh && (CMAP[origCh] || origCh) === (CMAP[qCh] || qCh) && origCh !== qCh);
          cBoxes.push({ c: origCh, xywh: getBox(pg.flat, k), v: origCh !== qCh });
        }
        hits.push(packHit(edMeta, pg, f, endI, combOrig, cBoxes, 1.0, f, sliceEnd));
        if (hits.length >= Math.max(maxHits * 3, 12)) break;
        pos = f + qLen;
      }
      if (hits.length >= Math.max(maxHits * 3, 12)) break;
    }
    hits.sort((a, b) => ((b.chapter > 0 ? 1 : 0) - (a.chapter > 0 ? 1 : 0)) || (a.page_no - b.page_no) || (a.char_start - b.char_start));
    return hits.slice(0, maxHits);
  }

  // 长句跨异文二阶段对齐
  const qBigrams = new Set();
  for (let i = 0; i < qLen - 1; i++) qBigrams.add(qNorm.slice(i, i + 2));

  const scored = [];
  for (let idx = 0; idx < pages.length; idx++) {
    let hitCnt = 0;
    const pg = pages[idx];
    qBigrams.forEach(bg => { if (pg.bigrams.has(bg)) hitCnt++; });
    if (hitCnt > 0) scored.push([hitCnt, idx]);
  }
  scored.sort((a, b) => b[0] - a[0]);

  const cands = [];
  for (const [, idx] of scored.slice(0, 18)) {
    const pg = pages[idx];
    const nxt = (idx + 1 < pages.length && pages[idx + 1].pno === pg.pno + 1) ? pages[idx + 1] : null;
    const combNorm = pg.norm + (nxt ? nxt.norm.slice(0, 75) : '');
    const combOrig = pg.orig + (nxt ? nxt.orig.slice(0, 75) : '');

    const win = Math.min(combNorm.length, Math.max(qLen + 10, Math.floor(qLen * 1.38)));
    const step = Math.max(1, Math.floor(qLen / 5));
    let bestRatio = 0, bestW = null;

    for (let s = 0; s < Math.max(1, combNorm.length - Math.floor(qLen / 3)); s += step) {
      const sub = combNorm.slice(s, s + win);
      const ms = matchingBlocks(qNorm, sub);
      if (!ms.length) continue;
      const matchedQ = ms.reduce((acc, m) => acc + m.size, 0);
      const spanB = (ms[ms.length - 1].b + ms[ms.length - 1].size) - ms[0].b;
      const compact = Math.min(1.0, (qLen * 1.35) / Math.max(spanB, qLen));
      const ratio = (matchedQ / qLen) * compact;
      if (ratio > bestRatio) { bestRatio = ratio; bestW = { s, sub, ms }; }
    }

    if (bestW && bestRatio >= 0.56) {
      const { s, sub, ms } = bestW;
      const subS = Math.max(0, ms[0].b - ms[0].a);
      const lastM = ms[ms.length - 1];
      const subE = Math.min(sub.length, lastM.b + lastM.size + (qLen - (lastM.a + lastM.size)));
      const absS = s + subS, absE = s + subE;
      if (absE <= absS) continue;

      const nP1 = Math.max(0, Math.min(absE, pg.norm.length) - absS);
      const nP2 = Math.max(0, absE - Math.max(absS, pg.norm.length));
      const targetPg = (nP1 >= nP2 || !nxt) ? pg : nxt;

      const matchedOrig = combOrig.slice(absS, absE);
      const qClean = query.replace(PUNCT_RE, '');
      const exactSet = new Set();
      matchingBlocks(qClean, matchedOrig).forEach(m => {
        for (let k = m.b; k < m.b + m.size; k++) exactSet.add(k);
      });

      const cBoxes = [];
      for (let k = absS; k < absE; k++) {
        const origCh = combOrig[k];
        // 若简繁归一相同且非异文词，只在异文或特殊俗字处标金框
        const isDiff = !exactSet.has(k - absS) && (CMAP[origCh] !== CMAP[qClean[k - absS] || '']);
        if (targetPg.pno === pg.pno && k < pg.norm.length) {
          cBoxes.push({ c: origCh, xywh: getBox(pg.flat, k), v: !exactSet.has(k - absS) });
        } else if (nxt && targetPg.pno === nxt.pno && k >= pg.norm.length) {
          const nk = k - pg.norm.length;
          if (nk < nxt.norm.length) cBoxes.push({ c: origCh, xywh: getBox(nxt.flat, nk), v: !exactSet.has(k - absS) });
        }
      }
      if (!cBoxes.length) continue;
      const tCs = targetPg.pno === pg.pno ? Math.min(absS, Math.max(0, pg.norm.length - 1)) : Math.max(0, absS - pg.norm.length);
      const tCe = targetPg.pno === pg.pno ? Math.min(absE, pg.norm.length) : Math.max(tCs + 1, Math.min(targetPg.norm.length, absE - pg.norm.length));
      cands.push([bestRatio, targetPg.pno, packHit(edMeta, targetPg, absS, absE, combOrig, cBoxes, bestRatio, tCs, tCe)]);
    }
  }

  cands.sort((a, b) => {
    const ba = a[2].chapter > 0 ? 1 : 0, bb = b[2].chapter > 0 ? 1 : 0;
    return (bb - ba) || (b[0] - a[0]);
  });
  const seen = new Set();
  for (const [, pno, rec] of cands) {
    if (seen.has(pno)) continue;
    seen.add(pno);
    hits.push(rec);
    if (hits.length >= maxHits) break;
  }
  return hits;
}

function packHit(edMeta, pg, absS, absE, combOrig, cBoxes, score, charStart, charEnd) {
  const xs = cBoxes.flatMap(b => [b.xywh[0], b.xywh[0] + b.xywh[2]]);
  const ys = cBoxes.flatMap(b => [b.xywh[1], b.xywh[1] + b.xywh[3]]);
  const rxywh = [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
  const cs = charStart ?? absS;
  return {
    ed_id: edMeta.ed_id,
    mid: edMeta.mid,
    zh_name: edMeta.zh_name,
    ja_name: edMeta.ja_name,
    page_no: pg.pno,
    chapter: getChapter(edMeta.ed_id, pg.pno, cs),
    banxin: pg.banxin,
    hit_type: 'direct',
    char_start: cs,
    char_end: charEnd ?? absE,
    score: Math.round(score * 100) / 100,
    context_left: combOrig.slice(Math.max(0, absS - 10), absS),
    matched_text: combOrig.slice(absS, absE),
    context_right: combOrig.slice(absE, absE + 12),
    canvas_w: pg.w,
    canvas_h: pg.h,
    region_xywh: rxywh,
    char_boxes: cBoxes,
    img_url: `${BUNDLE.cos_base}/images/${edMeta.ed_id}/page_${String(pg.pno).padStart(4, '0')}.jpg`,
    canvas_id: `${BUNDLE.public_iiif_base || BUNDLE.cos_base}/iiif/3/${edMeta.ed_id}/canvas/p${pg.pno}`,
    manifest_url: edMeta.manifest_url
  };
}

function bestAnchorWindow(needle, hay) {
  if (needle.length < 3 || hay.length < 3) return null;
  const win = Math.min(hay.length, needle.length + 12);
  const step = hay.length > 80 ? 2 : 1;
  let bestScore = 0, bestRes = null;
  for (let s = 0; s < Math.max(1, hay.length - 2); s += step) {
    const sub = hay.slice(s, s + win);
    const ms = matchingBlocks(needle, sub).filter(m => m.size >= 2);
    if (!ms.length) continue;
    const tot = ms.reduce((acc, m) => acc + m.size, 0);
    if (tot > bestScore) { bestScore = tot; bestRes = { s, ms, tot }; }
  }
  return (bestRes && bestRes.tot >= 4) ? bestRes : null;
}

function inferAlignedHit(anchorHit, dstEdId, qLen, targetCh = null) {
  if (!BUNDLE.segments || !BUNDLE.alignments) return null;
  const srcEd = anchorHit.ed_id;
  const srcPno = anchorHit.page_no;
  const cs = anchorHit.char_start || 0;
  const ce = anchorHit.char_end || (cs + Math.max(2, qLen));
  const midPos = (cs + ce) / 2;
  const reqCh = (targetCh && targetCh > 0) ? targetCh : (anchorHit.chapter || getChapter(srcEd, srcPno, Math.floor(midPos)));
  if (reqCh > 0 && !editionHasChapter(dstEdId, reqCh)) return null;

  const segs = (BUNDLE.segments[srcEd] || {})[String(srcPno)];
  const srcEntry = PAGE_BY_NO[`${srcEd}:${srcPno}`];
  if (!segs || !srcEntry) return null;

  let candSegs = segs.filter(sg => sg[1] - 20 <= midPos && midPos <= sg[2] + 20)
    .sort((a, b) => Math.abs((a[1] + a[2]) / 2 - midPos) - Math.abs((b[1] + b[2]) / 2 - midPos));
  if (!candSegs.length) {
    candSegs = [...segs].sort((a, b) => Math.abs((a[1] + a[2]) / 2 - midPos) - Math.abs((b[1] + b[2]) / 2 - midPos));
  }

  let chosenSeg = null, alignRec = null;
  for (const sg of candSegs) {
    const ar = BUNDLE.alignments[`${srcEd}:${srcPno}:${sg[0]}:${dstEdId}`];
    if (ar) { chosenSeg = sg; alignRec = ar; break; }
  }
  if (!alignRec || !chosenSeg) return null;

  const [dstPno, dstSpan, dstCs, dstCe, sharedNg, conf] = alignRec;
  const dstEntry = PAGE_BY_NO[`${dstEdId}:${dstPno}`];
  if (!dstEntry) return null;
  const dstSegCh = getChapter(dstEdId, dstPno, Math.floor((dstCs + dstCe) / 2));
  if (reqCh > 0 && dstSegCh > 0 && !chaptersCompatible(reqCh, dstSegCh)) return null;

  const srcPages = PAGES_INDEX[srcEd];
  const prevSrc = (srcEntry.idx > 0 && srcPages[srcEntry.idx - 1].pno === srcPno - 1) ? srcPages[srcEntry.idx - 1] : null;
  const nextSrc = (srcEntry.idx + 1 < srcPages.length && srcPages[srcEntry.idx + 1].pno === srcPno + 1) ? srcPages[srcEntry.idx + 1] : null;
  const prePad = prevSrc ? prevSrc.norm.slice(-40) : '';
  const postPad = nextSrc ? nextSrc.norm.slice(0, 40) : '';
  const extSrcNorm = normStr(prePad + srcEntry.pg.norm + postPad);
  const adjCs = prePad.length + cs, adjCe = prePad.length + ce;
  const leftCtx = extSrcNorm.slice(Math.max(0, adjCs - 36), adjCs);
  const rightCtx = extSrcNorm.slice(adjCe, adjCe + 36);

  const dstPages = PAGES_INDEX[dstEdId];
  const dstPg = dstEntry.pg;
  const prevDst = (dstEntry.idx > 0 && dstPages[dstEntry.idx - 1].pno === dstPno - 1) ? dstPages[dstEntry.idx - 1] : null;
  const nextDst = (dstEntry.idx + 1 < dstPages.length && dstPages[dstEntry.idx + 1].pno === dstPno + 1) ? dstPages[dstEntry.idx + 1] : null;

  const slices = [];
  if (prevDst && dstCs < 70 && prevDst.norm.length > 0) {
    slices.push([prevDst, Math.max(0, prevDst.norm.length - 90), prevDst.norm.length]);
  }
  slices.push([dstPg, Math.max(0, dstCs - 90), Math.min(dstPg.norm.length, dstCe + 110)]);
  if (nextDst && (dstSpan >= 2 || dstCe > dstPg.norm.length - 80) && nextDst.norm.length > 0) {
    slices.push([nextDst, 0, Math.min(nextDst.norm.length, 150)]);
  }

  let corrNorm = '', corrOrig = '';
  const corrMap = [];
  for (const [p, a, b] of slices) {
    corrNorm += normStr(p.norm.slice(a, b));
    corrOrig += p.orig.slice(a, b);
    for (let k = a; k < b; k++) corrMap.push([p, k]);
  }
  if (!corrMap.length) return null;

  const lMatch = bestAnchorWindow(leftCtx, corrNorm);
  let rMatch = null;
  if (lMatch) {
    const lLast = lMatch.ms[lMatch.ms.length - 1];
    const lEnd = lMatch.s + lLast.b + lLast.size;
    const rFrom = Math.max(0, lEnd - 4);
    const rTo = Math.min(corrNorm.length, lEnd + Math.max(60, qLen * 3 + 36));
    const subR = bestAnchorWindow(rightCtx, corrNorm.slice(rFrom, rTo));
    if (subR) rMatch = { s: rFrom + subR.s, ms: subR.ms };
  } else {
    rMatch = bestAnchorWindow(rightCtx, corrNorm);
  }

  let spanS = 0, spanE = 0, precRank = 0;
  if (lMatch && rMatch) {
    const lLast = lMatch.ms[lMatch.ms.length - 1];
    const rFirst = rMatch.ms[0];
    const gapS = lMatch.s + lLast.b + lLast.size;
    const stepBack = Math.min(rFirst.a, 4);
    const rawGapE = rMatch.s + rFirst.b - stepBack;
    const gapE = rawGapE > gapS ? rawGapE : (rMatch.s + rFirst.b);
    if (gapE - gapS > 0 && gapE - gapS <= Math.max(32, qLen * 3 + 12)) {
      spanS = gapS; spanE = gapE; precRank = 2;
    } else if (gapE === gapS) {
      spanS = Math.max(0, gapS - 2); spanE = Math.min(corrMap.length, gapS + 2); precRank = 2;
    } else {
      const unL = Math.min(6, leftCtx.length - (lLast.a + lLast.size));
      spanS = Math.min(corrMap.length - 1, gapS + unL);
      spanE = Math.min(corrMap.length, spanS + Math.max(2, qLen));
      precRank = 1;
    }
  } else if (lMatch) {
    const lLast = lMatch.ms[lMatch.ms.length - 1];
    const unL = Math.min(6, leftCtx.length - (lLast.a + lLast.size));
    spanS = Math.min(corrMap.length - 1, lMatch.s + lLast.b + lLast.size + unL);
    spanE = Math.min(corrMap.length, spanS + Math.max(2, qLen));
    precRank = 1;
  } else if (rMatch) {
    const rFirst = rMatch.ms[0];
    const unR = Math.min(6, rFirst.a);
    spanE = Math.max(1, rMatch.s + rFirst.b - unR);
    spanS = Math.max(0, spanE - Math.max(2, qLen));
    precRank = 1;
  } else {
    if (reqCh > 0 && chaptersCompatible(reqCh, dstSegCh) && (sharedNg >= 4 || conf >= 0.35)) {
      const segLen = Math.max(1, chosenSeg[2] - chosenSeg[1]);
      const rel = Math.max(0, Math.min(1, (midPos - chosenSeg[1]) / segLen));
      const estDstK = Math.round(dstCs + rel * Math.max(0, dstCe - dstCs));
      let corrEst = corrMap.findIndex(([pgI, kI]) => pgI.pno === dstPno && kI >= estDstK);
      if (corrEst < 0) corrEst = 0;
      spanS = Math.max(0, corrEst - Math.max(1, Math.floor(qLen / 2)));
      spanE = Math.min(corrMap.length, spanS + Math.max(2, qLen));
      precRank = 0;
    } else {
      return null;
    }
  }
  if (spanE <= spanS) spanE = Math.min(corrMap.length, spanS + Math.max(2, qLen));

  const pCounts = {};
  for (let i = spanS; i < spanE; i++) {
    const pno = corrMap[i][0].pno;
    pCounts[pno] = (pCounts[pno] || 0) + 1;
  }
  const targetPno = Number(Object.entries(pCounts).sort((a, b) => b[1] - a[1])[0][0]);
  const targetPg = PAGE_BY_NO[`${dstEdId}:${targetPno}`].pg;
  const cBoxes = [];
  for (let i = spanS; i < spanE; i++) {
    const [p, k] = corrMap[i];
    if (p.pno === targetPno && k < p.norm.length) {
      cBoxes.push({ c: corrOrig[i], xywh: getBox(p.flat, k), v: false, a: true });
    }
  }
  if (!cBoxes.length) return null;

  const edMeta = BUNDLE.editions.find(e => e.ed_id === dstEdId);
  const xs = cBoxes.flatMap(b => [b.xywh[0], b.xywh[0] + b.xywh[2]]);
  const ys = cBoxes.flatMap(b => [b.xywh[1], b.xywh[1] + b.xywh[3]]);
  const rxywh = [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];

  return {
    ed_id: edMeta.ed_id,
    mid: edMeta.mid,
    zh_name: edMeta.zh_name,
    ja_name: edMeta.ja_name,
    page_no: targetPno,
    chapter: getChapter(dstEdId, targetPno, corrMap[spanS][1]),
    banxin: targetPg.banxin,
    hit_type: 'aligned',
    via_ed: srcEd,
    via_zh_name: anchorHit.zh_name,
    via_ja_name: anchorHit.ja_name,
    via_page: srcPno,
    score: conf,
    _rank: precRank * 10000 + sharedNg * 10 + conf,
    context_left: corrOrig.slice(Math.max(0, spanS - 10), spanS),
    matched_text: corrOrig.slice(spanS, spanE),
    context_right: corrOrig.slice(spanE, spanE + 12),
    canvas_w: targetPg.w,
    canvas_h: targetPg.h,
    region_xywh: rxywh,
    char_boxes: cBoxes,
    img_url: `${BUNDLE.cos_base}/images/${edMeta.ed_id}/page_${String(targetPno).padStart(4, '0')}.jpg`,
    canvas_id: `${BUNDLE.public_iiif_base || BUNDLE.cos_base}/iiif/3/${edMeta.ed_id}/canvas/p${targetPno}`,
    manifest_url: edMeta.manifest_url
  };
}

function editionLabel(ed) {
  return LANG === 'ja' ? ed.ja_name.split('（')[0] : ed.zh_name;
}

const MOBILE_MQ = window.matchMedia('(max-width: 820px)');
const isMobile = () => MOBILE_MQ.matches;
let COLS = 'auto';
let LOAD_FAILED = false;

function updateStageCaption() {
  const el = document.getElementById('stageCaption');
  const {query, count} = el.dataset;
  el.textContent = query ? I18N[LANG].stageParallel(query, Number(count)) : I18N[LANG].stageIdle;
  el.title = el.textContent;
}

// data-tx：元素文字；data-t：title 与 aria-label
function applyDataT(root) {
  const t = I18N[LANG];
  root.querySelectorAll('[data-tx]').forEach(el => { el.textContent = t[el.dataset.tx]; });
  root.querySelectorAll('[data-t]').forEach(el => {
    el.title = t[el.dataset.t];
    if (el.matches('button, a, input')) el.setAttribute('aria-label', t[el.dataset.t]);
  });
}

function applyLangUI() {
  const t = I18N[LANG];
  document.title = t.title;
  document.documentElement.lang = LANG === 'ja' ? 'ja' : 'zh-CN';
  document.getElementById('langZh').classList.toggle('active', LANG === 'zh');
  document.getElementById('langJa').classList.toggle('active', LANG === 'ja');
  applyDataT(document);
  document.getElementById('queriesInput').placeholder = t.placeholder;
  document.getElementById('boxBtn').textContent = SHOW_BOXES ? t.boxOn : t.boxOff;
  if (window.HLMChangelog) HLMChangelog.setLang(LANG);
  updateStageCaption();

  document.getElementById('presetBar').innerHTML = t.presets.map((lbl, i) =>
    `<button class="preset-chip" onclick="loadPreset(${i})">${esc(lbl)}</button>`
  ).join('');

  const colUrl = BUNDLE ? BUNDLE.collection_url : './guji/iiif/3/collection.json';
  const mirUrl = `https://projectmirador.org/embed/?iiif-content=${encodeURIComponent(new URL(colUrl, location.href).href)}`;
  document.getElementById('helpBody').innerHTML = t.helpHtml(colUrl, mirUrl);

  if (BUNDLE) {
    document.querySelectorAll('.iiif-win').forEach(win => {
      const ed = BUNDLE.editions.find(book => book.ed_id === win.dataset.edition);
      win.querySelector('.win-ed').textContent = editionLabel(ed);
    });
    renderWitnessPills();
    renderCatalog();
    renderWinTabs();
    if (LAST_RESULTS) renderApparatus(LAST_RESULTS);
  } else if (LOAD_FAILED) {
    showLoadError();
  }
}

function setLang(l) {
  LANG = l;
  applyLangUI();
  syncUrl();
}

function syncUrl() {
  try {
    const p = new URLSearchParams();
    const q = document.getElementById('queriesInput').value.trim();
    if (q) p.set('q', q);
    p.set('lang', LANG);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  } catch (e) {}
}

function openHelp() {
  const dlg = document.getElementById('helpDialog');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
document.getElementById('helpDialog').addEventListener('click', (e) => {
  if (e.target.id === 'helpDialog') e.target.close();
});

function loadPreset(i) {
  document.getElementById('queriesInput').value = PRESET_QUERIES[i];
  executeBatchSearch();
}

function switchDrawer(mode) {
  document.getElementById('tabSearchBtn').classList.toggle('active', mode === 'search');

async function boot() {
  applyLangUI();
  applyCols();
  try {
    const res = await fetch('./data/showcase_bundle.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    BUNDLE = await res.json();
  } catch (e) {
    LOAD_FAILED = true;
    showLoadError();
    return;
  }

  const pairs = Array.from(BUNDLE.cmap_pairs || '');  // 按 Unicode 码点切分，避免扩展区汉字代理对错位
  for (let i = 0; i + 1 < pairs.length; i += 2) {
    CMAP[pairs[i]] = pairs[i + 1];
  }

  BUNDLE.editions.forEach(ed => {
    SELECTED_EDS.add(ed.ed_id);
    const rawPages = BUNDLE.pages[ed.ed_id] || [];
    PAGES_INDEX[ed.ed_id] = rawPages.map((r, idx) => {
      const norm = normStr(r[4]);
      const bgs = new Set();
      for (let i = 0; i < norm.length - 1; i++) bgs.add(norm.slice(i, i + 2));
      const pgObj = { pno: r[0], w: r[1], h: r[2], banxin: r[3], norm, orig: r[5], flat: r[6], bigrams: bgs };
      PAGE_BY_NO[`${ed.ed_id}:${r[0]}`] = { idx, pg: pgObj };
      return pgObj;
    });
  });

  const q0 = new URLSearchParams(location.search).get('q');
  if (q0) document.getElementById('queriesInput').value = q0;
  document.getElementById('searchBtn').disabled = false;

  HLMCite.init('./data/cite_config.json');
  applyLangUI();
  const at = HLMCite.parseAt(location.search);     // 引用链接：直接打开所引的页并框出位置
  if (window.HLMChangelog) {
    HLMChangelog.init({ url: './data/releases.json', badgeEl: document.getElementById('verBtn'), lang: LANG, isDeepLink: !!at });
  }
  if (at && !q0) {
    document.getElementById('queriesInput').value = '';
    document.getElementById('apparatusList').innerHTML = `<div class="notice">${esc(I18N[LANG].citedNote)}</div>`;
    document.getElementById('windowsGrid').innerHTML = '';
  } else {
    executeBatchSearch(true);
  }
  if (at) openCitedLeaf(at);
}

function executeBatchSearch(initial) {
  if (!BUNDLE) return;
  const queries = document.getElementById('queriesInput').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!queries.length) {
    LAST_RESULTS = null;
    document.getElementById('apparatusList').innerHTML = `<div class="notice">${esc(I18N[LANG].emptyInput)}</div>`;
    document.getElementById('queriesInput').focus();
    return;
  }
  if (initial !== true) syncUrl();

  const t0 = performance.now();
  const results = [];
  for (const q of queries.slice(0, 50)) {
    const byEd = {};
    let anchors = [];
    const qLen = normStr(q).length;
    const fetchMax = qLen >= 5 ? 4 : 3;
    for (const ed of BUNDLE.editions) {
      if (!SELECTED_EDS.has(ed.ed_id)) continue;
      const hs = searchInEdition(ed.ed_id, q, fetchMax);
      byEd[ed.ed_id] = hs;
      if (hs.length) anchors.push(...hs);
    }

    let targetCh = null;
    if (qLen >= 5 && anchors.length) {
      const votes = {};
      for (const ed of BUNDLE.editions) {
        const hs = (byEd[ed.ed_id] || []).filter(h => (h.chapter || 0) > 0 && h.score >= 0.65);
        if (!hs.length) continue;
        const topH = hs.reduce((a, b) => b.score > a.score ? b : a);
        const ck = (topH.chapter === 17 || topH.chapter === 18) ? 17 : topH.chapter;
        (votes[ck] ||= []).push(topH.score);
      }
      const ranked = Object.entries(votes).sort((a, b) => {
        const sa = a[1].reduce((x, y) => x + y, 0), sb = b[1].reduce((x, y) => x + y, 0);
        return (sb - sa) || (b[1].length - a[1].length) || (Math.max(...b[1]) - Math.max(...a[1]));
      });
      if (ranked.length) {
        const [bestCkStr, bestScores] = ranked[0];
        const totW = Object.values(votes).flat().reduce((x, y) => x + y, 0);
        const sumBest = bestScores.reduce((x, y) => x + y, 0);
        const hiCnt = bestScores.filter(s => s >= 0.75).length;
        if ((bestScores.length >= 2 && (sumBest >= totW * 0.5 || hiCnt >= 2)) || (ranked.length === 1 && Math.max(...bestScores) >= 0.8)) {
          targetCh = Number(bestCkStr);
        }
      }
    }

    if (targetCh !== null) {
      const filteredAnchors = [];
      for (const ed of BUNDLE.editions) {
        if (!byEd[ed.ed_id]) continue;
        const cur = byEd[ed.ed_id];
        let kept;
        if (!editionHasChapter(ed.ed_id, targetCh)) {
          kept = cur.filter(h => h.score >= 0.92).slice(0, 3);
        } else {
          const sameCh = cur.filter(h => chaptersCompatible(h.chapter || 0, targetCh));
          kept = sameCh.length ? sameCh.slice(0, 3) : cur.filter(h => h.score >= 0.92).slice(0, 3);
        }
        byEd[ed.ed_id] = kept;
        filteredAnchors.push(...kept.filter(h => (h.chapter || 0) > 0 && chaptersCompatible(h.chapter || 0, targetCh)));
      }
      anchors = filteredAnchors;
    } else {
      for (const ed of BUNDLE.editions) {
        if (byEd[ed.ed_id]) byEd[ed.ed_id] = byEd[ed.ed_id].slice(0, 3);
      }
    }

    if (anchors.length && BUNDLE.alignments) {
      anchors.sort((a, b) => b.score - a.score);
      for (const ed of BUNDLE.editions) {
        if (!SELECTED_EDS.has(ed.ed_id) || (byEd[ed.ed_id] && byEd[ed.ed_id].length)) continue;
        let bestInf = null;
        for (const anc of anchors) {
          const inf = inferAlignedHit(anc, ed.ed_id, qLen, targetCh);
          if (inf && (!bestInf || inf._rank > bestInf._rank)) bestInf = inf;
        }
        if (bestInf) {
          delete bestInf._rank;
          byEd[ed.ed_id] = [bestInf];
        }
      }
    }
    let total = 0;
    Object.values(byEd).forEach(arr => { total += arr.length; });
    results.push({ query: q, target_chapter: targetCh, total_hits: total, by_edition: byEd });
  }
  const elapsed = (performance.now() - t0).toFixed(1);
  LAST_RESULTS = { query_count: results.length, elapsed_ms: elapsed, results };
  CUR = null;
  renderApparatus(LAST_RESULTS);
  document.getElementById('apparatusList').scrollTop = 0;
  const firstHit = results.findIndex(r => r.total_hits > 0);
  if (firstHit >= 0) openParallel(firstHit);
  else { destroyViewers(); document.getElementById('windowsGrid').innerHTML = `<div class="stage-placeholder">${esc(I18N[LANG].noHit)}</div>`; }
}

function renderApparatus(data) {
  const t = I18N[LANG];
  let directCnt = 0, alignedCnt = 0;
  data.results.forEach(r => {
    Object.values(r.by_edition).forEach(arr => arr.forEach(h => {
      if (h.hit_type === 'aligned') alignedCnt++;
      else directCnt++;
    }));
  });
  const exportHtml = (directCnt + alignedCnt) ? `<span class="export-links">
      <button class="btn-parallel" onclick="HLMCite.open(citeResults(), LANG)" title="${esc(t.citeTip)}">${esc(t.citeBtn)}</button>
      ${esc(t.exportLabel)}
      <button class="link-btn" onclick="exportCSV()" title="${esc(t.exportCsvTip)}">CSV</button>
      <button class="link-btn" onclick="exportWebAnnotation()" title="${esc(t.exportAnnoTip)}">JSON-LD</button></span>` : '';
  let html = `<div class="meta-strip"><span>${esc(t.statFmt(data.query_count, directCnt, alignedCnt))}</span>${exportHtml}</div>`;

  data.results.forEach((item, qi) => {
    const eds = BUNDLE.editions.filter(ed => item.by_edition[ed.ed_id]);
    const nHitEd = eds.filter(ed => item.by_edition[ed.ed_id].length).length;
    const idxStr = String(qi + 1).padStart(2, '0');

    html += `<div class="app-entry" id="entry-${qi}">
      <div class="app-head">
        <div class="app-lemma">
          <span class="app-idx">${idxStr}</span>
          <span class="app-qtext" title="${esc(item.query)}">${esc(item.query)}</span>
        </div>
        ${nHitEd ? `<button class="btn-parallel" onclick="openParallel(${qi})">${esc(t.parallelBtn(nHitEd))}</button>` : ''}
      </div>`;

    if (!nHitEd) {
      html += `<div class="notice" style="padding:11px 14px">${esc(t.noHit)}</div>`;
    } else {
      html += `<table class="rdg-table"><tbody>`;
      eds.forEach(ed => {
        const shortWit = editionLabel(ed).replace(/本$/, '');
        const arr = item.by_edition[ed.ed_id];
        if (!arr.length) {
          const chMiss = (item.target_chapter && !editionHasChapter(ed.ed_id, item.target_chapter))
            ? (LANG === 'ja' ? `該当なし（第${item.target_chapter}回欠）` : `未检出（此本缺第 ${item.target_chapter} 回）`)
            : t.missing;
          html += `<tr class="rdg-row is-missing">
            <td class="rdg-wit"><span class="wit-stamp is-missing">${esc(shortWit)}</span></td>
            <td class="rdg-text miss">${esc(chMiss)}</td>
          </tr>`;
          return;
        }
        arr.forEach((h, hi) => {
          const isAl = h.hit_type === 'aligned';
          const stampCls = isAl ? 'wit-stamp is-aligned' : 'wit-stamp';
          const viaName = LANG === 'ja' ? (h.via_ja_name || '').split('（')[0] : (h.via_zh_name || '');
          const badgeHtml = isAl ? `<span class="rdg-align-badge">${esc(t.alignBadge(viaName, h.via_page))}</span>` : '';
          const midHtml = h.char_boxes.map(cb =>
            (isAl || cb.a) ? `<span class="ch-aligned">${esc(cb.c)}</span>`
              : (cb.v ? `<span class="ch-diff">${esc(cb.c)}</span>` : `<span>${esc(cb.c)}</span>`)
          ).join('');
          const bxHtml = h.banxin ? `<span class="rdg-banxin">${esc(h.banxin)}</span>` : '';
          const chTag = h.chapter != null ? (h.chapter > 0 ? ` · 第${h.chapter}回` : (LANG === 'ja' ? ' · 序目' : ' · 序目')) : '';

          html += `<tr class="rdg-row" tabindex="0" role="button" data-key="${qi}:${ed.ed_id}:${hi}"
              onclick="openHit(${qi}, '${ed.ed_id}', ${hi})"
              onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">
            <td class="rdg-wit">
              <span class="${stampCls}">${esc(shortWit)}</span>
              <span class="wit-folio">${esc(t.folioFmt(h.page_no) + chTag)}</span>
            </td>
            <td class="rdg-text">
              ${badgeHtml}<span class="ctx">${esc(h.context_left)}</span>${midHtml}<span class="ctx">${esc(h.context_right)}</span>${bxHtml}
            </td>
          </tr>`;
        });
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;
  });
  document.getElementById('apparatusList').innerHTML = html;
  if (CUR) markActiveEntry(CUR.qi, CUR.focusKey);
}

// 当前右侧打开的内容：{ qi, picks: [{ edId, hi, hit, viewerId }], activeEd, focusKey }
let CUR = null;

function markActiveEntry(qi, focusKey) {
  document.querySelectorAll('.app-entry').forEach((el, i) => el.classList.toggle('active-entry', i === qi));
  document.querySelectorAll('.rdg-row').forEach(el => el.classList.toggle('focused', !!focusKey && el.dataset.key === focusKey));
}

function destroyViewers() {
  const caption = document.getElementById('stageCaption');
  delete caption.dataset.query;
  delete caption.dataset.count;
  updateStageCaption();
  VIEWERS.forEach(v => { try { v.destroy(); } catch (e) {} });
  VIEWERS = [];
  CUR = null;
  document.getElementById('windowsGrid').innerHTML = '';
  document.getElementById('winTabs').innerHTML = '';
}

function renderWinTabs() {
  const box = document.getElementById('winTabs');
  if (!CUR || CUR.picks.length < 2) { box.innerHTML = ''; return; }
  box.innerHTML = CUR.picks.map(p => {
    const ed = BUNDLE.editions.find(e => e.ed_id === p.edId);
    const cls = ['win-tab', p.edId === CUR.activeEd ? 'active' : '', p.hit.hit_type === 'aligned' ? 'is-aligned' : ''].join(' ');
    return `<button class="${cls}" onclick="setActiveWin('${p.edId}', false)">${esc(editionLabel(ed))}</button>`;
  }).join('');
}

function setActiveWin(edId, flash) {
  if (!CUR) return;
  CUR.activeEd = edId;
  document.querySelectorAll('.iiif-win').forEach(win => {
    const on = win.dataset.edition === edId;
    win.classList.toggle('is-active', on);
    if (on && flash) {
      win.classList.remove('flash');
      void win.offsetWidth;
      win.classList.add('flash');
    }
  });
  renderWinTabs();
}

function openParallel(qi, pick) {
  const item = LAST_RESULTS && LAST_RESULTS.results[qi];
  if (!item) return;
  const picks = [];
  BUNDLE.editions.forEach(ed => {
    const arr = item.by_edition[ed.ed_id];
    if (!arr || !arr.length) return;
    const hi = (pick && pick.edId === ed.ed_id && arr[pick.hi]) ? pick.hi : 0;
    picks.push({ edId: ed.ed_id, hi, hit: arr[hi] });
  });
  const focusKey = pick ? `${qi}:${pick.edId}:${pick.hi}` : null;
  markActiveEntry(qi, focusKey);
  if (!picks.length) return;

  destroyViewers();
  const grid = document.getElementById('windowsGrid');
  const qShort = item.query.length > 30 ? item.query.slice(0, 30) + '…' : item.query;
  Object.assign(document.getElementById('stageCaption').dataset, { query: qShort, count: picks.length });
  updateStageCaption();
  CUR = { qi, picks, activeEd: pick ? pick.edId : picks[0].edId, focusKey };
  picks.forEach((p, i) => { p.viewerId = mountWin(grid, p.hit, i); });
  setActiveWin(CUR.activeEd, !!pick);
}

// 点击结果行：保持诸本并观，只把该本定位到这一处
function openHit(qi, edId, hi) {
  const same = CUR && CUR.qi === qi && CUR.picks.find(p => p.edId === edId && p.hi === hi);
  if (same) {
    CUR.focusKey = `${qi}:${edId}:${hi}`;
    markActiveEntry(qi, CUR.focusKey);
    setActiveWin(edId, true);
    refocus(same.viewerId);
  } else {
    openParallel(qi, { edId, hi });
  }
  if (isMobile()) setMobileView('stage');
}

function openBookLeaf(edId, pno) {
  const ed = BUNDLE.editions.find(e => e.ed_id === edId);
  if (!ed) return;
  destroyViewers();
  markActiveEntry(-1, null);
  const grid = document.getElementById('windowsGrid');
  const hit = {
    ed_id: ed.ed_id, zh_name: ed.zh_name, page_no: pno, banxin: (PAGE_BY_NO[`${edId}:${pno}`] || { pg: {} }).pg.banxin || '',
    canvas_w: ed.sample_w, canvas_h: ed.sample_h,
    img_url: `${BUNDLE.cos_base}/images/${ed.ed_id}/page_${String(pno).padStart(4, '0')}.jpg`,
    manifest_url: ed.manifest_url,
    char_boxes: [], region_xywh: null
  };
  CUR = { qi: -1, picks: [{ edId, hi: 0, hit }], activeEd: edId, focusKey: null };
  CUR.picks[0].viewerId = mountWin(grid, hit, 0);
  setActiveWin(edId, false);
  if (isMobile()) setMobileView('stage');
}

// 引用时每个底本取一处命中：当前正在看的那一句，用右侧窗口里打开的那一处
function citeResults() {
  return LAST_RESULTS.results.map((item, qi) => {
    if (!CUR || CUR.qi !== qi) return item;
    const by = Object.assign({}, item.by_edition);
    CUR.picks.forEach(p => { if (by[p.edId] && by[p.edId][p.hi]) by[p.edId] = [by[p.edId][p.hi]]; });
    return { query: item.query, by_edition: by };
  });
}

function openCitedLeaf(at) {
  const ed = BUNDLE.editions.find(e => e.ed_id === at.ed);
  if (!ed || !(ed.showcase_pnos || []).includes(at.page)) return;
  const pg = (PAGE_BY_NO[`${at.ed}:${at.page}`] || { pg: {} }).pg;
  destroyViewers();
  markActiveEntry(-1, null);
  const hit = {
    ed_id: ed.ed_id, zh_name: ed.zh_name, page_no: at.page, banxin: pg.banxin || '',
    canvas_w: pg.w || ed.sample_w, canvas_h: pg.h || ed.sample_h,
    img_url: `${BUNDLE.cos_base}/images/${ed.ed_id}/page_${String(at.page).padStart(4, '0')}.jpg`,
    manifest_url: ed.manifest_url,
    char_boxes: [{ c: '', xywh: at.xywh, v: false }], region_xywh: at.xywh
  };
  CUR = { qi: -1, picks: [{ edId: at.ed, hi: 0, hit }], activeEd: at.ed, focusKey: null };
  CUR.picks[0].viewerId = mountWin(document.getElementById('windowsGrid'), hit, 0);
  setActiveWin(at.ed, false);
  if (isMobile()) setMobileView('stage');
}

function mountWin(grid, hit, idx) {
  const ed = BUNDLE.editions.find(e => e.ed_id === hit.ed_id);
  const miradorUrl = `https://projectmirador.org/embed/?iiif-content=${encodeURIComponent(hit.manifest_url)}`;
  const win = document.createElement('section');
  win.className = 'iiif-win';
  win.dataset.edition = hit.ed_id;
  const id = `osd-${idx}-${Date.now()}`;
  const isAl = hit.hit_type === 'aligned';

  win.innerHTML = `
    <div class="win-hud">
      <div class="win-label">
        <span class="win-ed">${esc(editionLabel(ed))}</span>
        ${isAl ? `<span class="win-align-pill" data-tx="alignHud" data-t="legAlignedFull"></span>` : ''}
        <span class="win-banxin">${hit.banxin ? esc(hit.banxin) : ''}</span>
      </div>
      <div class="win-nav">
        <button class="hud-btn" data-t="prevLeaf" onclick="stepLeaf('${id}', '${hit.ed_id}', -1)">‹</button>
        <input class="hud-pno" id="${id}-inp" inputmode="numeric" data-t="pageInput" value="${hit.page_no}" onchange="jumpLeaf('${id}', '${hit.ed_id}', this.value)" />
        <button class="hud-btn" data-t="nextLeaf" onclick="stepLeaf('${id}', '${hit.ed_id}', 1)">›</button>
        <span class="hud-sep"></span>
        <button class="hud-btn" data-t="zoomOut" onclick="zoomWin('${id}', 0.7)">−</button>
        <button class="hud-btn" data-t="zoomIn" onclick="zoomWin('${id}', 1.43)">＋</button>
        <button class="hud-btn focus-btn" data-t="focus" onclick="refocus('${id}')">⌖</button>
        <a class="hud-btn txt mirador-link" data-t="mirador" href="${miradorUrl}" target="_blank" rel="noopener">Mirador ↗</a>
      </div>
    </div>
    <div class="osd-wrap">
      <div class="osd-mount" id="${id}"></div>
      <div class="win-status" data-tx="loading"></div>
    </div>
  `;
  applyDataT(win);
  grid.appendChild(win);
  const statusEl = win.querySelector('.win-status');

  const viewer = OpenSeadragon({
    id,
    showNavigationControl: false,
    gestureSettingsMouse: { clickToZoom: false, scrollToZoom: true },
    animationTime: 0.6,
    minZoomImageRatio: 0.72,
    maxZoomPixelRatio: 4.0,
    tileSources: { type: 'image', url: hit.img_url, buildPyramid: false }
  });
  viewer._meta = { ed, focusBounds: null, win, firstHit: hit };

  viewer.addHandler('open', () => {
    statusEl.hidden = true;
    const h0 = viewer._meta.firstHit;
    viewer._meta.firstHit = null;   // 翻页后不再套用首个命中的字框
    if (!h0) return;
    (h0.char_boxes || []).forEach(cb => {
      const [x, y, w, h] = cb.xywh;
      const el = document.createElement('div');
      const isAlBox = (h0.hit_type === 'aligned' || cb.a);
      el.className = isAlBox ? 'iiif-box-aligned' : (cb.v ? 'iiif-box-var' : 'iiif-box-exact');
      el.title = cb.c;
      viewer.addOverlay({ element: el, location: viewer.viewport.imageToViewportRectangle(x, y, w, h) });
    });
    if (h0.region_xywh && h0.char_boxes && h0.char_boxes.length > 0) {
      const [rx, ry, rw, rh] = h0.region_xywh;
      const padX = Math.max(250, rw * 1.35), padY = Math.max(170, rh * 0.16);
      const fx = Math.max(0, rx - padX), fy = Math.max(0, ry - padY);
      const fw = Math.min(h0.canvas_w - fx, rw + padX * 2);
      const fh = Math.min(h0.canvas_h - fy, rh + padY * 2);
      const b = viewer.viewport.imageToViewportRectangle(fx, fy, fw, fh);
      viewer._meta.focusBounds = b;
      viewer.viewport.fitBounds(b, true);
    }
  });
  viewer.addHandler('open-failed', () => {
    statusEl.hidden = false;
    statusEl.dataset.tx = 'imgFail';
    statusEl.textContent = I18N[LANG].imgFail;
  });
  win.addEventListener('pointerdown', () => { if (CUR && CUR.activeEd !== hit.ed_id) setActiveWin(hit.ed_id, false); });
  VIEWERS.push(viewer);
  return id;
}

function refocus(id) {
  const v = VIEWERS.find(x => x.id === id);
  if (!v || !v.viewport) return;
  if (v._meta.focusBounds) v.viewport.fitBounds(v._meta.focusBounds, false);
  else v.viewport.goHome(false);
}

function refocusAll() {
  VIEWERS.forEach(v => refocus(v.id));
}

function zoomWin(id, factor) {
  const v = VIEWERS.find(x => x.id === id);
  if (!v || !v.viewport) return;
  v.viewport.zoomBy(factor);
  v.viewport.applyConstraints();
}

function stepLeaf(id, edId, d) {
  const v = VIEWERS.find(x => x.id === id);
  if (!v) return;
  const pnos = v._meta.ed.showcase_pnos || [];
  const inp = document.getElementById(id + '-inp');
  const cur = parseInt(inp.value || '1', 10);
  if (pnos.length) {
    const ci = pnos.indexOf(cur);
    const nextIdx = ci >= 0 ? Math.max(0, Math.min(pnos.length - 1, ci + d)) : 0;
    jumpLeaf(id, edId, pnos[nextIdx]);
  } else {
    jumpLeaf(id, edId, cur + d);
  }
}

function jumpLeaf(id, edId, target) {
  const v = VIEWERS.find(x => x.id === id);
  if (!v) return;
  const ed = v._meta.ed;
  const pnos = ed.showcase_pnos || [];
  let pno = parseInt(target, 10);
  if (!Number.isFinite(pno)) pno = ed.first_leaf;
  if (pnos.length && !pnos.includes(pno)) {
    pno = pnos.reduce((prev, curr) => Math.abs(curr - pno) < Math.abs(prev - pno) ? curr : prev);
  }
  document.getElementById(id + '-inp').value = pno;
  // 翻页后同步版心信息，并撤下只属于原命中页的「推定对应」标记
  const win = v._meta.win;
  const entry = PAGE_BY_NO[`${edId}:${pno}`];
  win.querySelector('.win-banxin').textContent = entry ? (entry.pg.banxin || '') : '';
  const pill = win.querySelector('.win-align-pill');
  if (pill) pill.remove();
  const statusEl = win.querySelector('.win-status');
  statusEl.dataset.tx = 'loading';
  statusEl.textContent = I18N[LANG].loading;
  statusEl.hidden = false;
  v.clearOverlays();
  v._meta.focusBounds = null;
  v._meta.firstHit = null;
  v.open({ type: 'image', url: `${BUNDLE.cos_base}/images/${edId}/page_${String(pno).padStart(4, '0')}.jpg`, buildPyramid: false });
}

// 导出符合 W3C / IIIF v3 国际标准的 Web Annotation JSON-LD！
function exportWebAnnotation() {
  if (!LAST_RESULTS) return;
  const items = [];
  LAST_RESULTS.results.forEach((qItem, qi) => {
    Object.values(qItem.by_edition).forEach(arr => {
      arr.forEach((h, hi) => {
        const [x, y, w, hgt] = h.region_xywh;
        const isAl = h.hit_type === 'aligned';
        items.push({
          id: `urn:hlm-pilot:anno:${qi + 1}:${h.ed_id}:p${h.page_no}:${hi + 1}`,
          type: "Annotation",
          motivation: isAl ? "linking" : "highlighting",
          body: [
            { type: "TextualBody", value: h.matched_text, language: "zh-Hant", purpose: "transcribing" },
            {
              type: "TextualBody",
              value: isAl ? `Query: ${qItem.query} (Inferred corresponding leaf via ${h.via_zh_name} p.${h.via_page} context anchor)` : `Query: ${qItem.query}`,
              purpose: "commenting"
            }
          ],
          target: {
            source: h.canvas_id,
            partOf: { id: h.manifest_url, type: "Manifest", label: { zh: [h.zh_name], ja: [h.ja_name] } },
            selector: { type: "FragmentSelector", conformsTo: "http://www.w3.org/TR/media-frags/", value: `xywh=pixel:${x},${y},${w},${hgt}` }
          }
        });
      });
    });
  });
  const annoPage = {
    "@context": "http://iiif.io/api/presentation/3/context.json",
    id: "urn:hlm-pilot:annotation-page:search-export",
    type: "AnnotationPage",
    items
  };
  const blob = new Blob([JSON.stringify(annoPage, null, 2)], { type: 'application/ld+json;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hongloumeng-iiif-annotations.jsonld';
  a.click();
}

function exportCSV() {
  if (!LAST_RESULTS) return;
  const rows = [['Query', 'Edition', 'Material_ID', 'Match_Mode', 'Leaf_Page', 'Banxin_Folio', 'Score', 'Context_Before', 'Matched_Transcription', 'Context_After', 'IIIF_Canvas_Target']];
  LAST_RESULTS.results.forEach(qItem => {
    Object.values(qItem.by_edition).forEach(arr => {
      arr.forEach(h => {
        const [x, y, w, hgt] = h.region_xywh;
        const mode = h.hit_type === 'aligned' ? `aligned(via_${h.via_ed}_p${h.via_page})` : 'direct';
        rows.push([
          qItem.query, h.zh_name, h.mid, mode, h.page_no, h.banxin || '',
          Math.round(h.score * 100) + '%', h.context_left, h.matched_text, h.context_right,
          `${h.canvas_id}#xywh=${x},${y},${w},${hgt}`
        ]);
      });
    });
  });
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'hongloumeng-collation-citations.csv';
  a.click();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

boot();
</script>
